  function modal({ title, description, body, footer, wide }) {
    const scrim = el("div", { class: "modal-scrim", onclick: (event) => { if (event.target === scrim) dismiss(); } });
    const panel = el("div", { class: "modal" + (wide ? " modal-wide" : ""), role: "dialog", "aria-modal": "true", "aria-label": title });

    panel.append(
      el("header", { class: "modal-head" }, [
        el("div", { style: "flex:1;min-width:0" }, [
          el("h2", { text: title }),
          description ? el("p", { text: description }) : null,
        ]),
        el("button", { class: "icon-btn", "aria-label": "Fechar", onclick: () => dismiss(),
          html: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">${ICON.close}</svg>` }),
      ]),
      el("div", { class: "modal-body" }, body),
    );
    if (footer) panel.append(el("footer", { class: "modal-foot" }, footer));

    scrim.append(panel);
    const dismiss = mountOverlay(scrim);

    requestAnimationFrame(() => {
      const first = panel.querySelector("input, textarea");
      if (first) first.focus();
    });

    return dismiss;
  }

  function openBoardDialog(board) {
    const editing = Boolean(board);
    let emoji = board ? board.emoji : BOARD_EMOJIS[0];
    let color = board ? board.color : BOARD_COLORS[0];
    let confirming = false;

    const name = el("input", { class: "text-input", placeholder: "Ex.: Landing pages que convertem" });
    name.value = board ? board.name : "";
    const description = el("textarea", { class: "textarea", rows: "2", placeholder: "Pra que serve esse board?" });
    description.value = board ? board.description || "" : "";

    const emojiBox = el("div", { class: "emojis" });
    const colorBox = el("div", { class: "swatches" });

    const paintPickers = () => {
      emojiBox.replaceChildren(...BOARD_EMOJIS.map((option) =>
        el("button", { class: "emoji", text: option, "aria-pressed": option === emoji ? "true" : "false",
          onclick: () => { emoji = option; paintPickers(); } })));
      colorBox.replaceChildren(...BOARD_COLORS.map((option) =>
        el("button", { class: "swatch", style: "background:" + option, "aria-label": "Cor " + option,
          "aria-pressed": option === color ? "true" : "false",
          onclick: () => { color = option; paintPickers(); } })));
    };
    paintPickers();

    const save = async () => {
      const value = name.value.trim();
      if (!value) return;
      const payload = { name: value, emoji, color, description: description.value.trim() };
      if (editing) { await updateBoard(board.id, payload); toast("Board atualizado", { tone: "success" }); }
      else {
        const created = await createBoard(payload);
        select({ type: "board", id: created.id });
        toast(`Board “${created.name}” criado`, { tone: "success" });
      }
      dismiss(); renderRail(); renderHead(); renderGrid();
    };

    name.addEventListener("keydown", (event) => { if (event.key === "Enter") save(); });

    const deleteButton = editing
      ? el("button", { class: "btn btn-danger left", text: "Excluir board", onclick: async (event) => {
          if (!confirming) {
            confirming = true;
            // Solto fica só o que não está em nenhum outro board.
            const count = state.items.filter((i) => i.boardIds.length === 1 && i.boardIds[0] === board.id).length;
            event.currentTarget.textContent = count
              ? `Confirmar exclusão (${contar(count, "item fica solto", "itens ficam soltos")})` : "Confirmar exclusão";
            return;
          }
          await deleteBoard(board.id);
          if (selectionKey(state.selection) === "board:" + board.id) state.selection = { type: "todos" };
          dismiss(); renderRail(); renderHead(); renderGrid();
          toast("Board excluído — as referências continuam salvas");
        } })
      : null;

    const dismiss = modal({
      title: editing ? "Editar board" : "Novo board",
      description: editing
        ? "Excluir o board não apaga as referências — elas voltam para “Sem board”."
        : "Boards agrupam referências por assunto. Uma referência pode estar em vários.",
      body: [
        el("div", {}, [el("span", { class: "field-label", text: "Nome" }), name]),
        el("div", {}, [el("span", { class: "field-label", text: "Descrição (opcional)" }), description]),
        el("div", {}, [el("span", { class: "field-label", text: "Ícone" }), emojiBox]),
        el("div", {}, [el("span", { class: "field-label", text: "Cor" }), colorBox]),
      ],
      footer: [
        deleteButton,
        el("button", { class: "btn btn-ghost", text: "Cancelar", onclick: () => dismiss() }),
        el("button", { class: "btn btn-primary", text: editing ? "Salvar" : "Criar board", onclick: save }),
      ].filter(Boolean),
    });
  }

  function openSettings() {
    let confirming = false;

    const exportButton = el("button", { class: "btn btn-primary", onclick: doExport },
      [svg(ICON.download, 14), "Exportar tudo"]);
    const fileInput = el("input", { type: "file", accept: "application/json,.json", hidden: true });
    fileInput.addEventListener("change", () => doImport(fileInput.files[0]));
    const folderInput = el("input", { type: "file", multiple: true, webkitdirectory: true, hidden: true });
    folderInput.addEventListener("change", async () => {
      const files = [...(folderInput.files || [])];
      folderInput.value = "";
      if (files.length) dismiss();
      await importFolder(files);
    });

    async function doExport() {
      const payload = {
        format: "referencias/backup", version: 1, exportedAt: new Date().toISOString(),
        boards: state.boards,
        items: await Promise.all(state.items.map(async ({ imageBlob, ...rest }) => Object.assign({}, rest, {
          imageData: imageBlob ? await blobToDataUrl(imageBlob) : undefined,
        }))),
      };
      const json = JSON.stringify(payload, null, 2);
      const filename = `referencias-${new Date().toISOString().slice(0, 10)}.json`;

      if (window.claude && window.claude.downloads) {
        try {
          await window.claude.downloads.save({ filename, data: json });
          toast(`Backup gerado (${formatBytes(new Blob([json]).size)})`, { tone: "success" });
        } catch (error) {
          if (error && error.code === "declined") return;
          toast("Não consegui salvar o arquivo agora", { tone: "error" });
        }
        return;
      }

      const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
      const anchor = el("a", { href: url, download: filename });
      document.body.append(anchor); anchor.click(); anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast(`Backup gerado (${formatBytes(new Blob([json]).size)})`, { tone: "success" });
    }

    /**
     * Aceita as duas embalagens do mesmo acervo: o backup exportado daqui, com
     * as imagens embutidas, e o acervo.json da pasta em disco, cujas imagens
     * são arquivos vizinhos. Quem está recuperando o próprio acervo não
     * deveria precisar saber qual dos dois tem na mão.
     */
    async function doImport(file) {
      if (!file) return;
      try {
        let parsed;
        try { parsed = JSON.parse(await file.text()); }
        catch { throw new Error("Esse arquivo não é um JSON válido"); }

        const known = parsed && (parsed.format === "referencias/backup" || parsed.format === VAULT_FORMAT);
        if (!known || !Array.isArray(parsed.items)) {
          throw new Error("Esse arquivo não é de Referências — use o backup exportado ou o acervo.json da pasta");
        }

        const { items, boards, semImagem } = await applyImport(parsed);

        // Arquivo válido e vazio é o caso mais perigoso: dizer "importei 0" com
        // um ✓ verde faz parecer que deu certo. Quase sempre é o arquivo
        // errado — ou o acervo.json depois de um "Limpar acervo".
        if (!items && !boards) {
          const anterior = await readRescue();
          toast("Esse arquivo está vazio — não tem nenhuma referência dentro", {
            tone: "error",
            action: anterior
              ? { label: `Restaurar ${anterior.items.length}`, run: () => { dismiss(); void restoreRescue(); } }
              : null,
          });
          return;
        }

        // O JSON sozinho não traz as imagens da pasta: o aviso oferece
        // escolher a pasta, e elas completam as referências que ficaram sem.
        reportImport({ items, boards, semImagem });
        // Fecha os ajustes: os números do topo eram de antes do import.
        dismiss();
        void tidyLibrary();
      } catch (error) {
        toast(error.message || "Arquivo inválido", { tone: "error" });
      } finally {
        fileInput.value = "";
      }
    }

    const dismiss = modal({
      title: "Ajustes e backup",
      description: "Onde o acervo é salvo, a cópia em arquivo e a zona de risco.",
      body: [
        el("div", { class: "stat-strip" }, [
          el("div", { class: "stat" }, [
            el("b", { text: String(state.items.length) }),
            el("span", { text: state.items.length === 1 ? "referência" : "referências" }),
          ]),
          el("div", { class: "stat-divider" }),
          el("div", { class: "stat" }, [
            el("b", { text: String(state.boards.length) }),
            el("span", { text: state.boards.length === 1 ? "board" : "boards" }),
          ]),
          el("div", { class: "stat-divider" }),
          el("div", { class: "stat" }, [
            el("b", { text: String(new Set(state.items.flatMap((i) => i.tags)).size) }),
            el("span", { text: "tags" }),
          ]),
        ]),

        el("section", { class: "section" }, [
          el("h3", { text: "Salvamento" }),
          el("p", { text: vaultOn()
            ? "O acervo está sendo gravado na pasta " + vault.name + "/ a cada alteração, com as imagens junto. Nada depende de você lembrar."
            : "Hoje o acervo só existe neste navegador — limpar os dados dele apaga tudo. Dá pra apontar uma pasta do computador e o acervo passa a ser gravado nela sozinho." }),
          el("div", { class: "row-actions" }, [
            el("button", { class: vaultOn() ? "btn btn-ghost" : "btn btn-primary",
              onclick: () => { dismiss(); openStorage(); } },
              [svg(ICON.folder, 14), vaultOn() ? "Pasta do acervo" : "Salvar numa pasta do computador"]),
          ]),
        ]),

        el("section", { class: "section" }, [
          el("h3", { text: "Cópia e importação" }),
          el("p", { text: "Exportar gera um único .json com tudo dentro, inclusive as imagens, pra guardar onde você quiser ou levar pra outra máquina." }),
          el("p", { text: "Pra trazer de volta um acervo da pasta, importe a pasta inteira: o acervo.json e as imagens vêm juntos, e se houver mais de uma versão (a cópia que você salvou, o histórico) você escolhe qual." }),
          el("div", { class: "row-actions" }, [
            exportButton, fileInput, folderInput,
            el("button", { class: "btn btn-ghost", onclick: () => folderInput.click() },
              [svg(ICON.folder, 14), "Importar pasta"]),
            el("button", { class: "btn btn-ghost", onclick: () => fileInput.click() },
              [svg(ICON.upload, 14), "Importar arquivo"]),
          ]),
          el("p", { class: "fine", text: "O import soma ao que já existe e, em cada referência, fica a versão editada por último — reimportar não duplica nada. Importando só um .json da pasta, as imagens ficam pendentes até você escolher a pasta. O navegador pode perguntar se quer \"enviar\" os arquivos: nada sai do seu computador, a página só lê." }),
        ]),

        el("section", { class: "section" }, [
          el("h3", { text: "Zona de risco" }),
          el("p", { text: !vaultOn()
            ? "Apaga todas as referências e boards deste navegador. Não dá pra desfazer — e, sem uma pasta configurada, não há cópia nenhuma."
            : "Apaga todas as referências e boards, e esvazia o acervo.json junto — ele é um espelho em tempo real. Antes, o acervo de agora fica guardado em " + VAULT_HISTORY + "/, com as imagens, e dá pra restaurar em Salvamento." }),
          el("div", { class: "row-actions" }, [
            el("button", { class: "btn btn-danger", text: "Limpar acervo", onclick: async (event) => {
              if (!confirming) {
                confirming = true;
                event.currentTarget.textContent = `Confirmar: apagar ${contar(state.items.length, "item", "itens")}`;
                return;
              }
              // O acervo de agora vai pro histórico antes de sumir do espelho.
              let guardada = null;
              if (vaultOn()) {
                // Só guarda a versão se a pasta estiver em dia: copiar um
                // acervo.json atrasado e depois apagar perderia o que veio depois.
                const emDia = await flushVault();
                guardada = emDia ? await saveHistoryNow("antes-de-limpar").catch(() => null) : null;
                if (!guardada && state.items.length) {
                  toast("Não consegui guardar uma versão antes de limpar — nada foi apagado", { tone: "error" });
                  return;
                }
              }
              state.items.forEach((item) => releaseCover(item.id));
              await Promise.all([dbClear(S_ITEMS), dbClear(S_BOARDS)]);
              state.items = []; state.boards = []; state.selection = { type: "todos" };
              dismiss(); renderRail(); renderHead(); renderGrid();
              if (guardada) {
                toast(`Acervo limpo — a versão de antes ficou em ${VAULT_HISTORY}/`, {
                  action: { label: "Desfazer", run: () => { void restoreVersion(guardada); } },
                });
              } else {
                toast("Acervo limpo", { tone: "success" });
              }
            } }),
          ]),
        ]),
      ],
      footer: [el("button", { class: "btn btn-ghost", text: "Fechar", onclick: () => dismiss() })],
    });
  }

  const blobToDataUrl = (blob) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });

  /* ═══════════════════════════ ações ══════════════════════════════ */

  function select(selection) {
    state.selection = selection;
    state.focusedId = null;
    state.railOpen = false;
    $("rail").dataset.open = "false";
    if (state.detailId) closeDetail();
    renderRail(); renderHead(); renderGrid();
    $("scroller").scrollTop = 0;
  }

  function clearFilters() {
    state.query = "";
    $("filter-input").value = "";
    state.kinds = [];
    state.selection = { type: "todos" };
    state.focusedId = null;
    renderRail(); renderHead(); renderGrid();
  }

  async function toggleFavorite(id) {
    const item = state.items.find((i) => i.id === id);
    if (!item) return;
    await updateItem(id, { favorite: !item.favorite });
    afterEdit();
  }

  function openSource(item) {
    if (!item.url) { openDetail(item.id); return; }
    window.open(item.url, "_blank", "noopener,noreferrer");
    touchOpened(item.id);
  }

  async function removeItem(item) {
    // O desfazer guarda a versão de agora, não a que o painel tinha ao abrir.
    const snapshot = Object.assign({}, state.items.find((i) => i.id === item.id) || item);
    await deleteItem(item.id);
    if (state.detailId === item.id) closeDetail();
    renderRail(); renderGrid();
    toast(`“${String(snapshot.title || "Referência").slice(0, 40)}” excluída`, {
      action: {
        label: "Desfazer",
        run: async () => { await createItem(snapshot); renderRail(); renderGrid(); },
      },
    });
  }

  function focusCapture() {
    const input = $("capture-input");
    input.focus();
    input.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  /* ═════════════════════════ captura ══════════════════════════════ */

  function titleFromUrl(url) {
    try {
      const parsed = new URL(url);
      const slug = parsed.pathname.split("/").filter(Boolean).pop();
      if (slug) {
        const cleaned = decodeURIComponent(slug)
          .replace(/\.\w{2,5}$/, "").replace(/[-_]+/g, " ").trim();
        if (cleaned) return cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
      }
      return parsed.hostname.replace(/^www\./, "");
    } catch { return url; }
  }

  function targetBoards() {
    const value = $("board-select").value;
    return value ? [value] : [];
  }

  /** `notes`: o texto que veio junto com o link vira a anotação dele. */
  async function saveLinks(urls, boardIds, notes) {
    const normalized = [...new Set(urls.map(normalizeUrl).filter(Boolean))];
    if (!normalized.length) throw new Error("Nenhuma URL válida no que você colou");

    return createItems(normalized.map((url) => {
      const title = titleFromUrl(url);
      return Object.assign({
        kind: "link", title, url, siteName: hostOf(url),
        boardIds, tags: suggestTags({ url, title, description: notes }),
      }, notes ? { notes } : {});
    }));
  }

  async function savePalette(colors, boardIds) {
    return createItem({
      kind: "palette",
      title: paletteTitle(colors),
      colors,
      boardIds,
      tags: ["cor", "paleta"],
    });
  }

  async function saveNote(text, boardIds) {
    const trimmed = text.trim();
    if (!trimmed) throw new Error("A nota está vazia");
    const [first, ...rest] = trimmed.split("\n");
    const title = first.length > 90 ? first.slice(0, 88).trimEnd() + "…" : first;
    // Primeira linha cortada no título: o corpo leva o texto inteiro, senão o
    // pedaço cortado sumia.
    const body = first.length > 90 ? trimmed : (rest.join("\n").trim() || undefined);
    return createItem({ kind: "note", title, description: body, boardIds, tags: suggestTags({ title, description: body }, 3) });
  }

  function compressImage(file, maxSize = 1600, quality = 0.82) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(image.width, image.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        const ratio = image.width / image.height || 1;
        URL.revokeObjectURL(url);
        // Só fica com a versão nova se ela compensar: uma imagem pequena já
        // otimizada pode sair maior, e navegador sem WebP devolve PNG.
        canvas.toBlob((blob) => {
          const better = blob && (blob.size < file.size || (scale < 1 && blob.type === "image/webp"));
          resolve({ blob: better ? blob : file, ratio });
        }, "image/webp", quality);
      };
      image.onerror = () => { URL.revokeObjectURL(url); resolve({ blob: file, ratio: 1 }); };
      image.src = url;
    });
  }

  async function saveImages(images, boardIds) {
    const drafts = [];
    for (const file of images) {
      // SVG e GIF entram como estão: redesenhar no canvas perderia o vetor e a animação.
      const isVector = file.type === "image/svg+xml" || file.type === "image/gif";
      const { blob, ratio } = isVector ? { blob: file, ratio: 1 } : await compressImage(file);
      // O título é o nome que a imagem vai ter na pasta: hash e "image.png"
      // viram "Imagem sem nome", pra você dar o nome de verdade.
      const title = imageTitleFromFile(file);
      drafts.push({
        kind: "image", title,
        imageBlob: blob, imageRatio: ratio, boardIds,
        tags: title === UNNAMED_IMAGE ? [] : suggestTags({ title }, 3),
      });
    }
    return createItems(drafts);
  }

  let firstLinkHintShown = false;

  async function submitCapture() {
    const input = $("capture-input");
    const text = input.value.trim();
    if (!text) return;

    const palette = parsePalette(text);
    const urls = palette ? [] : extractUrls(text);
    // O campo esvazia na hora e segue habilitado: já dá pra colar o próximo.
    input.value = "";
    growCapture();
    updateCaptureMode();

    try {
      if (palette) {
        const saved = await savePalette(palette, targetBoards());
        state.focusedId = saved.id;
        toast(`${palette.length === 1 ? "Cor" : "Paleta"} “${saved.title}” salva`, { tone: "success" });
      } else if (urls.length) {
        // A frase em volta do link não se perde: ela inteira, do jeito que
        // foi escrita, vira a anotação dele.
        const extra = textBesideUrls(text, urls) ? text : "";
        const saved = await saveLinks(urls, targetBoards(), extra || undefined);
        state.focusedId = saved[0].id;
        toast((saved.length > 1 ? `${saved.length} links salvos` : `“${saved[0].title.slice(0, 42)}” salvo`)
          + (extra ? " — o texto foi junto como anotação" : ""), { tone: "success" });
        if (!firstLinkHintShown) {
          firstLinkHintShown = true;
          setTimeout(() => toast("Nesta demo o título vem da URL — clique no card pra editar", {
            action: { label: "Entender", run: openAbout },
          }), 900);
        }
      } else {
        const saved = await saveNote(text, targetBoards());
        state.focusedId = saved.id;
        toast("Nota salva", { tone: "success" });
      }
      renderRail(); renderHead(); renderGrid();
    } catch (error) {
      if (!input.value) { input.value = text; growCapture(); updateCaptureMode(); }
      toast(error.message || "Não consegui salvar", { tone: "error" });
    }
  }

  async function handleFiles(files) {
    try {
      const images = [...files].filter((file) => /^image\//.test(file.type));
      if (!images.length) throw new Error("Nenhuma imagem reconhecida no arquivo");

      // Imagem que já é de uma referência (a da pasta imagens/, arrastada de
      // volta) completa a referência em vez de virar uma nova.
      const { matched, already, rest } = await completeFromFiles(images);
      const saved = rest.length ? await saveImages(rest, targetBoards()) : [];
      if (saved.length) state.focusedId = saved[0].id;
      renderRail(); renderGrid();

      const parts = [];
      if (saved.length) parts.push(saved.length > 1 ? `${saved.length} imagens salvas` : "Imagem salva");
      if (matched) parts.push(contar(matched, "voltou para a referência de origem", "voltaram para as referências de origem"));
      if (already) parts.push(contar(already, "já estava no acervo", "já estavam no acervo"));
      toast(parts.join(" · "), { tone: saved.length || matched ? "success" : "info" });
    } catch (error) {
      toast(error.message || "Não consegui salvar", { tone: "error" });
    }
  }

  function growCapture() {
    const input = $("capture-input");
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 168) + "px";
  }

  function updateCaptureMode() {
    const input = $("capture-input");
    const value = input.value.trim();
    const palette = parsePalette(value);
    const urls = palette ? [] : [...new Set(extractUrls(value).map(normalizeUrl).filter(Boolean))];
    const mode = !value ? "empty" : palette ? "palette" : urls.length ? "link" : "note";

    const icon = $("capture-icon");
    icon.dataset.mode = mode;
    icon.innerHTML =
      `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${
        mode === "link" ? ICON.link
          : mode === "palette" ? ICON.palette
          : mode === "note" ? ICON.note
          : ICON.plus}</svg>`;

    // Prévia das cores dentro da própria barra, pra confirmar o que vai salvar
    // antes de apertar Enter.
    const preview = $("capture-preview");
    preview.replaceChildren();
    preview.classList.toggle("hidden", !palette);
    if (palette) {
      palette.forEach((color) =>
        preview.append(el("span", { style: "background:" + color, title: color.toUpperCase() })));
    }

    const button = $("save-btn");
    button.disabled = mode === "empty";
    button.replaceChildren(
      document.createTextNode(
        mode === "palette" ? "Salvar paleta" : urls.length > 1 ? `Salvar ${urls.length}` : "Salvar"),
      el("kbd", { text: "↵", style: "border-color:currentColor;opacity:.7" }),
    );
  }

  /* ═════════════════════════ tema ═════════════════════════════════ */

  const prefersDark = () => window.matchMedia("(prefers-color-scheme: dark)").matches;
  const resolvedTheme = () => state.theme || (prefersDark() ? "dark" : "light");

  function applyTheme() {
    document.documentElement.dataset.theme = resolvedTheme();
  }

  function toggleTheme() {
    state.theme = resolvedTheme() === "dark" ? "light" : "dark";
    applyTheme();
    // Espelhado no localStorage porque o script do <head> precisa do tema
    // antes da primeira pintura, e o IndexedDB só responde depois.
    try { localStorage.setItem("referencias:theme", state.theme); } catch (e) {}
    persistPrefs();
    renderHead();
  }

  /* ═════════════════════ navegação por teclado ════════════════════ */

  const isTyping = (target) =>
    target instanceof HTMLElement &&
    (["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName) || target.isContentEditable);

  const modKey = () => (/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? "⌘" : "Ctrl ");

  function moveFocus(direction) {
    const items = visibleItems();
    if (!items.length) return;

    const currentIndex = state.focusedId ? items.findIndex((i) => i.id === state.focusedId) : -1;

    if (direction === "next" || direction === "previous") {
      const delta = direction === "next" ? 1 : -1;
      const next = currentIndex === -1 ? 0
        : Math.min(Math.max(currentIndex + delta, 0), items.length - 1);
      setFocus(items[next].id);
      return;
    }

    const nodes = [...$("grid").querySelectorAll("[data-item-id]")];
    if (!nodes.length) return;
    if (currentIndex === -1) { setFocus(items[0].id); return; }

    const currentNode = nodes.find((node) => node.dataset.itemId === state.focusedId);
    if (!currentNode) return;

    // Geometria em vez de índice: no mural as colunas têm alturas diferentes,
    // então "o de baixo" não é simplesmente index + número de colunas.
    const origin = currentNode.getBoundingClientRect();
    const horizontal = direction === "left" || direction === "right";
    const sign = direction === "right" || direction === "down" ? 1 : -1;

    let best = null;
    for (const node of nodes) {
      const id = node.dataset.itemId;
      if (!id || id === state.focusedId) continue;
      const rect = node.getBoundingClientRect();
      const main = horizontal ? rect.left - origin.left : rect.top - origin.top;
      if (main * sign <= 1) continue;
      const cross = horizontal ? Math.abs(rect.top - origin.top) : Math.abs(rect.left - origin.left);
      const cost = Math.abs(main) + cross * 2.5;
      if (!best || cost < best.cost) best = { id, cost };
    }
    if (best) setFocus(best.id);
  }

  function setFocus(id) {
    const previous = $("grid").querySelector('[data-focused="true"]');
    if (previous) previous.dataset.focused = "false";
    state.focusedId = id;
    const node = $("grid").querySelector(`[data-item-id="${CSS.escape(id)}"]`);
    if (node) { node.dataset.focused = "true"; node.scrollIntoView({ block: "nearest" }); }
  }

  function onKeyDown(event) {
    const mod = event.metaKey || event.ctrlKey;

    if (mod && event.key.toLowerCase() === "k") {
      event.preventDefault();
      openPalette();
      return;
    }

    if (isTyping(event.target) || mod || event.altKey) {
      // Esc dentro de um campo da gaveta fecha mesmo assim — o blur roda antes,
      // então o que estava sendo escrito é salvo em vez de sumir.
      if (event.key === "Escape" && isTyping(event.target) && state.detailId
          && event.target.closest(".drawer")) {
        event.target.blur();
        closeDetail();
      } else if (event.key === "Escape" && isTyping(event.target) && event.target.closest(".modal")) {
        // Num diálogo (novo board, ajustes), Esc fecha mesmo com o cursor num campo.
        event.target.blur();
        closeTopOverlay();
      }
      return;
    }

    if (event.key === "Escape") {
      if (closeTopOverlay()) return;
      if (state.focusedId) { setFocus(null); state.focusedId = null; }
      return;
    }

    if (overlayStack.length) return;

    // Caps Lock ligado não desliga os atalhos: "A" vale como "a".
    const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
    switch (key) {
      case "a": event.preventDefault(); focusCapture(); return;
      case "/": event.preventDefault(); $("filter-input").focus(); return;
      case "b": event.preventDefault(); openBoardDialog(null); return;
      case "t": event.preventDefault(); toggleTheme(); return;
      case "?": event.preventDefault(); openShortcuts(); return;
      case "ArrowDown": event.preventDefault(); moveFocus("down"); return;
      case "ArrowUp": event.preventDefault(); moveFocus("up"); return;
      case "ArrowLeft": event.preventDefault(); moveFocus("left"); return;
      case "ArrowRight": event.preventDefault(); moveFocus("right"); return;
      case "j": event.preventDefault(); moveFocus("next"); return;
      case "k": event.preventDefault(); moveFocus("previous"); return;
    }

    // Enter num botão com foco é do botão, não do card selecionado.
    if (event.key === "Enter" && event.target.closest && event.target.closest("button, a, [role=button]")) return;

    // Só age sobre o card que está na tela: uma referência recém-salva fora
    // do recorte atual não é apagada nem favoritada sem ser vista.
    const target = visibleItems().find((i) => i.id === state.focusedId);
    if (!target) return;

    if (event.key === "Enter") { event.preventDefault(); openDetail(target.id); }
    else if (key === "o") { event.preventDefault(); openSource(target); }
    else if (key === "f") { event.preventDefault(); toggleFavorite(target.id); }
    else if (event.key === "Delete" || event.key === "Backspace") {
      event.preventDefault(); removeItem(target);
    }
  }

  function onDetailKeyDown(event) {
    if (!state.detailId || overlayStack.length > 1) return;
    if (isTyping(event.target) || event.metaKey || event.ctrlKey || event.altKey) return;

    const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
    const list = detailList();
    const index = list.indexOf(state.detailId);
    const item = state.items.find((i) => i.id === state.detailId);
    if (key === "j" && index !== -1 && index < list.length - 1) { event.preventDefault(); openDetail(list[index + 1], { navigating: true }); }
    else if (key === "k" && index > 0) { event.preventDefault(); openDetail(list[index - 1], { navigating: true }); }
    // Os atalhos que o painel anuncia valem com ele aberto.
    else if (key === "f" && item) { event.preventDefault(); toggleFavorite(item.id); }
    else if (key === "o" && item && item.url) { event.preventDefault(); openSource(item); }
    else if (key === "Delete" && item) { event.preventDefault(); removeItem(item); }
  }

  /* ═══════════════════════ colar e arrastar ═══════════════════════ */

  let dragDepth = 0;
  let dropzone = null;

  function showDropzone(show) {
    if (show && !dropzone) {
      dropzone = el("div", { class: "dropzone" }, [
        el("div", {}, [
          svg(ICON.image, 30),
          el("p", { text: "Solte para salvar no acervo" }),
        ]),
      ]);
      document.body.append(dropzone);
    } else if (!show && dropzone) {
      dropzone.remove();
      dropzone = null;
    }
  }

  /* ═══════════════════════════ arranque ═══════════════════════════ */

  async function load() {
    let opened = false;

    try {
      const [boards, items, prefs] = await Promise.all([
        dbAll(S_BOARDS), dbAll(S_ITEMS), dbGet(S_PREFS, "app"),
      ]);
      opened = true;

      if (prefs) {
        state.view = prefs.view || state.view;
        state.sort = prefs.sort || state.sort;
        state.theme = prefs.theme || null;
      }
      applyTheme();

      // O que entrou enquanto o banco abria — uma captura rápida, a pasta
      // conectada antes da hora — não é atropelado pelo que veio do banco:
      // a versão em memória é a mais nova.
      const adopt = (loadedBoards, loadedItems) => {
        const itemIds = new Set(state.items.map((item) => item.id));
        const boardIds = new Set(state.boards.map((board) => board.id));
        state.items = [...state.items, ...loadedItems.filter((item) => !itemIds.has(item.id))];
        state.boards = [...state.boards, ...loadedBoards.filter((board) => !boardIds.has(board.id))];
        sortBoards();
      };

      if (!boards.length && !items.length && !(prefs && prefs.onboarded) && !state.items.length) {
        const seed = await buildSeed();
        await rawPut(S_PREFS, { view: state.view, sort: state.sort, theme: state.theme, onboarded: true }, "app");
        // Se um acervo de verdade chegou enquanto os exemplos eram pintados,
        // os exemplos ficam de fora.
        if (!state.items.length) {
          await rawPutMany(S_BOARDS, seed.boards);
          await rawPutMany(S_ITEMS, seed.items);
          adopt(seed.boards, seed.items);
        }
      } else {
        adopt(boards, items);
      }

      // A pasta do acervo é a cópia que sobrevive ao navegador: se ela existe,
      // é dela que vem o que faltar aqui — inclusive tudo, se o navegador
      // tiver sido limpo desde a última visita.
      await restoreVault({ settings: !prefs });
    } catch (error) {
      console.error("Banco local indisponível", error);
      toast(opened ? "Algo falhou ao abrir o acervo" : "Não consegui abrir o banco local; esta sessão não vai salvar",
        { tone: "error" });
    }

    renderStorage();
    void requestPersistence();

    state.ready = true;
    renderRail(); renderHead(); renderGrid();
    void tidyLibrary();
  }

  function wire() {
    const captureInput = $("capture-input");
    captureInput.addEventListener("input", () => { growCapture(); updateCaptureMode(); });
    captureInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); submitCapture(); }
      else if (event.key === "Escape") { captureInput.value = ""; growCapture(); updateCaptureMode(); captureInput.blur(); }
    });
    $("save-btn").addEventListener("click", submitCapture);
    $("upload-btn").addEventListener("click", () => $("file-input").click());
    $("file-input").addEventListener("change", (event) => {
      handleFiles(event.target.files);
      event.target.value = "";
    });

    let filterTimer = null;
    $("filter-input").addEventListener("input", (event) => {
      const value = event.target.value;
      clearTimeout(filterTimer);
      filterTimer = setTimeout(() => {
        state.query = value;
        state.focusedId = null;
        $("filter-clear").classList.toggle("hidden", !value);
        renderGrid();
      }, 130);
    });
    $("filter-input").addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.target.value = ""; state.query = "";
        $("filter-clear").classList.add("hidden");
        renderGrid(); event.target.blur();
      }
    });
    $("filter-clear").addEventListener("click", () => {
      $("filter-input").value = ""; state.query = "";
      $("filter-clear").classList.add("hidden");
      renderGrid(); $("filter-input").focus();
    });

    $("sort-select").addEventListener("change", (event) => {
      state.sort = event.target.value;
      persistPrefs();
      renderGrid();
    });

    $("palette-btn").addEventListener("click", openPalette);
    $("theme-btn").addEventListener("click", toggleTheme);
    $("shortcuts-btn").addEventListener("click", openShortcuts);
    $("settings-btn").addEventListener("click", openSettings);
    $("storage-btn").addEventListener("click", openStorage);
    $("rail-open").addEventListener("click", () => { $("rail").dataset.open = "true"; });
    $("rail-close").addEventListener("click", () => { $("rail").dataset.open = "false"; });

    $("palette-kbd").textContent = modKey() + "K";

    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keydown", onDetailKeyDown);

    // Fechar a aba não pode custar os últimos segundos de trabalho: o que
    // estiver esperando o debounce vai pro disco na hora em que ela some.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden" && vaultDirty) void writeVault();
    });

    window.addEventListener("paste", async (event) => {
      if (isTyping(event.target) || overlayStack.length) return;

      const files = [...(event.clipboardData ? event.clipboardData.files : [])];
      if (files.length) { event.preventDefault(); await handleFiles(files); return; }

      const text = event.clipboardData && event.clipboardData.getData("text/plain");
      if (!text) return;
      const trimmed = text.trim();

      const palette = parsePalette(trimmed);
      if (palette) {
        event.preventDefault();
        try {
          const saved = await savePalette(palette, targetBoards());
          state.focusedId = saved.id;
          renderRail(); renderGrid();
          toast(`${palette.length === 1 ? "Cor" : "Paleta"} “${saved.title}” salva`, { tone: "success" });
        } catch {
          toast("Não consegui salvar essa paleta", { tone: "error" });
        }
        return;
      }

      // "index.html" ou "Node.js" colados na página não viram link.
      const looksLikeUrl = /^https?:\/\//i.test(trimmed) || looksLikeDomain(trimmed);
      if (!looksLikeUrl || /\s/.test(trimmed)) return;

      event.preventDefault();
      try {
        const saved = await saveLinks(extractUrls(trimmed), targetBoards());
        state.focusedId = saved[0].id;
        renderRail(); renderGrid();
        toast(`“${saved[0].title.slice(0, 42)}” salvo`, { tone: "success" });
      } catch {
        toast("Não consegui salvar esse link", { tone: "error" });
      }
    });

    window.addEventListener("dragenter", (event) => {
      if (!event.dataTransfer || ![...event.dataTransfer.types].includes("Files")) return;
      dragDepth += 1;
      showDropzone(true);
    });
    window.addEventListener("dragover", (event) => {
      if (event.dataTransfer && [...event.dataTransfer.types].includes("Files")) event.preventDefault();
    });
    window.addEventListener("dragleave", () => {
      // dragleave dispara ao cruzar cada filho; o contador evita o overlay piscar
      dragDepth = Math.max(0, dragDepth - 1);
      if (!dragDepth) showDropzone(false);
    });
    window.addEventListener("drop", async (event) => {
      if (!event.dataTransfer || ![...event.dataTransfer.types].includes("Files")) return;
      event.preventDefault();
      dragDepth = 0;
      showDropzone(false);
      const files = [...event.dataTransfer.files];
      if (files.length) await handleFiles(files);
    });

    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (!state.theme) { applyTheme(); renderHead(); }
    });

    // O visualizador também carimba data-theme na raiz; seguimos o que ele definir.
    new MutationObserver(() => {
      const stamped = document.documentElement.dataset.theme;
      if (stamped && stamped !== resolvedTheme()) { state.theme = stamped; renderHead(); }
    }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

    growCapture();
    updateCaptureMode();
  }

  applyTheme();
  wire();
  renderGrid();
  load();
})();
</script>

</body>
</html>
