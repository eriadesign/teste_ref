<title>Referências — seu banco pessoal de ideias</title>
<meta name="description" content="Espaço pessoal de referências: capture links, imagens e ideias em segundos e encontre a certa na hora em que você estiver criando alguma coisa.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">

<!-- Preview do link. As URLs precisam ser absolutas: os robôs de
     compartilhamento não resolvem caminho relativo. Trocando de domínio,
     ajuste as três linhas abaixo. -->
<link rel="canonical" href="https://produtosauvp.github.io/teste_ref/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://produtosauvp.github.io/teste_ref/">
<meta property="og:title" content="Referências — seu banco pessoal de ideias">
<meta property="og:description" content="Espaço pessoal de referências: capture links, imagens e ideias em segundos e encontre a certa na hora em que você estiver criando alguma coisa.">
<meta property="og:image" content="https://produtosauvp.github.io/teste_ref/social-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">

<script>
  // Aplica o tema salvo antes da primeira pintura. Sem isto, quem usa o tema
  // escuro vê um lampejo claro a cada carregamento — a preferência só é lida
  // do IndexedDB depois, e o IndexedDB é assíncrono.
  (function () {
    try {
      var saved = localStorage.getItem("referencias:theme");
      var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
    } catch (e) {}
  })();
</script>
</head>
<body>

<style>
  /* ──────────────────────────────────────────────────────────────────
     Tokens. Claro é o padrão; o escuro entra pela preferência do sistema
     e os dois são reafirmados por [data-theme] para que o botão de tema
     (o desta página ou o do visualizador) vença a media query nos dois
     sentidos.
     ────────────────────────────────────────────────────────────────── */
  :root {
    --bg: #faf9f7;
    --bg-elevated: #ffffff;
    --bg-sunken: #f1efeb;
    --surface: #ffffff;
    --surface-hover: #f5f3f0;
    --border: #e6e2dc;
    --border-strong: #d3cec6;
    --text: #1b1b1d;
    --text-muted: #6b6862;
    --text-faint: #96928a;
    --accent: #c2593a;
    --accent-soft: #f8e7e0;
    --accent-text: #a8462b;
    --good: #2f7d5b;
    --warn: #a8720f;
    --bad: #b4342a;
    --overlay: rgb(28 25 23 / 0.45);
    --shadow-panel: 0 1px 2px rgb(28 25 23 / 0.06), 0 24px 48px -24px rgb(28 25 23 / 0.28);
    --chip-cover: rgb(255 255 255 / 0.92);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0d;
      --bg-elevated: #121215;
      --bg-sunken: #08080a;
      --surface: #17171b;
      --surface-hover: #1e1e23;
      --border: #26262d;
      --border-strong: #35353f;
      --text: #f2f2f3;
      --text-muted: #9b9ba5;
      --text-faint: #67676f;
      --accent: #d97757;
      --accent-soft: #3a231b;
      --accent-text: #f0a184;
      --good: #4ea87b;
      --warn: #d9a441;
      --bad: #e2695c;
      --overlay: rgb(0 0 0 / 0.55);
      --shadow-panel: 0 1px 2px rgb(0 0 0 / 0.4), 0 24px 48px -24px rgb(0 0 0 / 0.7);
      --chip-cover: rgb(10 10 12 / 0.72);
    }
  }

  :root[data-theme="light"] {
    --bg: #faf9f7;
    --bg-elevated: #ffffff;
    --bg-sunken: #f1efeb;
    --surface: #ffffff;
    --surface-hover: #f5f3f0;
    --border: #e6e2dc;
    --border-strong: #d3cec6;
    --text: #1b1b1d;
    --text-muted: #6b6862;
    --text-faint: #96928a;
    --accent: #c2593a;
    --accent-soft: #f8e7e0;
    --accent-text: #a8462b;
    --good: #2f7d5b;
    --warn: #a8720f;
    --bad: #b4342a;
    --overlay: rgb(28 25 23 / 0.45);
    --shadow-panel: 0 1px 2px rgb(28 25 23 / 0.06), 0 24px 48px -24px rgb(28 25 23 / 0.28);
    --chip-cover: rgb(255 255 255 / 0.92);
  }

  :root[data-theme="dark"] {
    --bg: #0b0b0d;
    --bg-elevated: #121215;
    --bg-sunken: #08080a;
    --surface: #17171b;
    --surface-hover: #1e1e23;
    --border: #26262d;
    --border-strong: #35353f;
    --text: #f2f2f3;
    --text-muted: #9b9ba5;
    --text-faint: #67676f;
    --accent: #d97757;
    --accent-soft: #3a231b;
    --accent-text: #f0a184;
    --good: #4ea87b;
    --warn: #d9a441;
    --bad: #e2695c;
    --overlay: rgb(0 0 0 / 0.55);
    --shadow-panel: 0 1px 2px rgb(0 0 0 / 0.4), 0 24px 48px -24px rgb(0 0 0 / 0.7);
    --chip-cover: rgb(10 10 12 / 0.72);
  }

  :root {
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light dark;
  }
  /* O tema escolhido no app vale também pros controles nativos: barra de
     rolagem, lista do <select> e seletor de cor. */
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    overscroll-behavior: none;
  }

  button, input, textarea, select { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; }
  ::selection { background: var(--accent); color: #fff; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }

  * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border: 3px solid transparent;
    border-radius: 999px;
    background-clip: content-box;
  }

  /* ── esqueleto ──────────────────────────────────────────────────── */

  .app { display: flex; height: 100vh; height: 100dvh; }

  .rail {
    width: 17rem;
    flex: 0 0 17rem;
    display: flex;
    flex-direction: column;
    background: var(--bg-elevated);
    border-right: 1px solid var(--border);
    z-index: 30;
  }

  .rail-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 16px 16px 12px;
  }
  .mark {
    width: 28px; height: 28px;
    flex: none;
    display: grid; place-items: center;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
  }
  .rail-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .rail-sub { font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; }

  .rail-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px 12px; }

  .group-title {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 10px 6px;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-faint);
  }

  .nav-row { position: relative; }
  .nav {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-muted);
    text-align: left;
    transition: background 0.12s, color 0.12s;
  }
  .nav:hover { background: var(--surface-hover); color: var(--text); }
  .nav[aria-current="true"] {
    background: var(--surface-hover);
    color: var(--text);
    font-weight: 500;
  }
  .nav-icon { width: 16px; flex: none; display: grid; place-items: center; }
  .nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-count {
    flex: none;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }

  .nav-edit {
    position: absolute; right: 6px; top: 50%;
    transform: translateY(-50%);
    padding: 4px; border-radius: 6px;
    color: var(--text-faint);
    background: var(--surface-hover);
    opacity: 0;
    transition: opacity 0.12s;
  }
  .nav-row:hover .nav-edit, .nav-edit:focus-visible { opacity: 1; }
  .nav-edit:hover { color: var(--text); }

  .rail-foot { border-top: 1px solid var(--border); padding: 6px 10px 8px; }
  .foot-row { display: flex; gap: 4px; }
  .foot-btn {
    flex: 1; padding: 8px; border-radius: 8px;
    display: grid; place-items: center;
    color: var(--text-faint);
    transition: background 0.12s, color 0.12s;
  }
  .foot-btn:hover { background: var(--surface-hover); color: var(--text); }

  .state-row {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 7px 10px; border-radius: 8px;
    font-size: 12px; color: var(--text-muted); text-align: left;
    transition: background 0.12s, color 0.12s;
  }
  .state-row:hover { background: var(--surface-hover); color: var(--text); }
  .dot { width: 6px; height: 6px; border-radius: 999px; flex: none; background: var(--good); }

  .vault-state {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface);
  }
  .vault-state[data-tone="warn"] { border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .vault-state[data-tone="bad"] { border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .vault-state .dot { margin-top: 6px; }
  .vault-state b { display: block; font-size: 13px; font-weight: 600; }
  .vault-state span:not(.dot) { display: block; font-size: 12px; color: var(--text-muted); line-height: 1.5; }

  .versions {
    display: flex; flex-direction: column; margin-top: 12px;
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  }
  .version {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 10px 12px; text-align: left;
    background: var(--surface); color: var(--text);
  }
  .version + .version { border-top: 1px solid var(--border); }
  .version b { display: block; font-size: 12.5px; font-weight: 600; }
  .version span:not(.ico) { display: block; font-size: 11.5px; color: var(--text-faint); margin-top: 2px; overflow-wrap: anywhere; }
  .version .btn { flex: none; }
  .version-choice { cursor: pointer; transition: background 0.12s; }
  .version-choice:hover, .version-choice:focus-visible { background: var(--surface-hover); }
  .version-choice .ico { color: var(--text-faint); flex: none; }

  .missing-image {
    display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
    padding: 14px; border-radius: 12px;
    border: 1px dashed var(--border); background: var(--bg-sunken);
  }
  .missing-image p { margin: 0; font-size: 12px; line-height: 1.6; color: var(--text-muted); }

  /* ── área principal ─────────────────────────────────────────────── */

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .head {
    flex: none;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    display: flex; flex-direction: column; gap: 10px;
  }

  .head-top { display: flex; align-items: center; gap: 12px; }
  .head-titles { flex: 1; min-width: 0; }
  .head-title {
    margin: 0;
    font-size: 17px; font-weight: 600; letter-spacing: -0.015em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .head-desc {
    font-size: 12px; color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .search-open {
    display: flex; align-items: center; gap: 8px;
    flex: none;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-sunken);
    font-size: 12px;
    color: var(--text-faint);
    transition: border-color 0.12s, color 0.12s;
  }
  .search-open:hover { border-color: var(--border-strong); color: var(--text-muted); }

  kbd {
    font-family: var(--sans);
    font-size: 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 4px;
    color: inherit;
  }

  /* captura */
  .capture {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    transition: border-color 0.12s;
  }
  .capture:focus-within { border-color: var(--border-strong); }
  .capture-icon { margin: 6px 0 0 4px; flex: none; color: var(--text-faint); display: grid; }
  .capture-icon[data-mode="link"], .capture-icon[data-mode="note"] { color: var(--accent); }
  .capture-field { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #capture-input {
    width: 100%;
    margin-top: 4px;
    max-height: 168px;
    border: 0; background: none; outline: none; resize: none;
    font-size: 14px; line-height: 1.6;
  }
  /* prévia das cores enquanto você digita, antes de salvar */
  .capture-preview {
    display: flex; gap: 4px; height: 22px;
    padding-bottom: 2px;
  }
  .capture-preview > span {
    flex: 0 0 34px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  #capture-input::placeholder { color: var(--text-faint); }
  .capture-actions { display: flex; align-items: center; gap: 6px; align-self: flex-end; flex: none; }

  .icon-btn {
    padding: 7px; border-radius: 8px; color: var(--text-faint);
    display: grid; place-items: center;
    transition: background 0.12s, color 0.12s;
  }
  .icon-btn:hover { background: var(--surface-hover); color: var(--text); }

  select.control, .control {
    height: 34px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-sunken);
    color: var(--text-muted);
    font-size: 12px;
    transition: color 0.12s, border-color 0.12s;
  }
  select.control:hover, .control:hover { color: var(--text); }
  select.control { max-width: 11rem; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 12.5px; font-weight: 600;
    transition: opacity 0.12s, background 0.12s, color 0.12s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { background: var(--bg-sunken); color: var(--text-faint); cursor: not-allowed; opacity: 1; }
  .btn-ghost { border: 1px solid var(--border); color: var(--text-muted); font-weight: 500; }
  .btn-ghost:hover { background: var(--surface-hover); color: var(--text); }
  .btn-danger { border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); color: var(--bad); font-weight: 500; }
  .btn-danger:hover { background: color-mix(in srgb, var(--bad) 12%, transparent); }

  /* barra de filtros */
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filter-wrap { position: relative; flex: 1; min-width: 12rem; }
  .filter-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
  #filter-input {
    width: 100%; height: 34px;
    padding: 0 30px 0 32px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-sunken);
    outline: none;
    font-size: 13px;
    transition: border-color 0.12s;
  }
  #filter-input:focus { border-color: var(--border-strong); }
  #filter-input::placeholder { color: var(--text-faint); }
  #filter-input::-webkit-search-cancel-button { display: none; }
  .filter-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); padding: 4px; border-radius: 6px; color: var(--text-faint); }
  .filter-clear:hover { color: var(--text); }

  .chip {
    height: 34px; padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-sunken);
    font-size: 12px; font-weight: 500;
    color: var(--text-muted);
    transition: all 0.12s;
  }
  .chip:hover { color: var(--text); }
  .chip[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent-text);
  }

  .segmented {
    display: flex; align-items: center;
    height: 34px; padding: 2px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-sunken);
  }
  .seg {
    padding: 5px 8px; border-radius: 6px;
    color: var(--text-faint);
    display: grid; place-items: center;
    transition: all 0.12s;
  }
  .seg:hover { color: var(--text); }
  .seg[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }

  .count { margin-left: auto; font-size: 12px; color: var(--text-faint); font-variant-numeric: tabular-nums; }

  /* ── mural ──────────────────────────────────────────────────────── */

  .scroller { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 24px 40px; }

  .mural { column-gap: 16px; columns: 4; }
  .mural > * { break-inside: avoid; margin-bottom: 16px; }
  .grade { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
  .lista { display: flex; flex-direction: column; gap: 6px; }

  @media (max-width: 1600px) { .mural { columns: 4; } .grade { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 1280px) { .mural { columns: 3; } .grade { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 900px)  { .mural { columns: 2; } .grade { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 620px)  { .mural { columns: 1; } .grade { grid-template-columns: 1fr; } }

  .card {
    position: relative;
    display: flex; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.12s, background 0.12s;
  }
  .card:hover { border-color: var(--border-strong); background: var(--surface-hover); }
  .card[data-focused="true"] {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .grade .card { height: 100%; }

  .cover { position: relative; overflow: hidden; background: var(--bg-sunken); }
  .cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .cover-fallback { display: grid; place-items: center; }
  .cover-missing { align-content: center; gap: 6px; background: var(--bg-sunken); }
  .cover-missing-label { font-size: 11px; color: var(--text-faint); }

  /* paleta: as próprias cores são a capa */
  .cover-palette { display: flex; }
  .cover-palette > span { flex: 1 1 0; min-width: 0; }
  .cover-palette.compact > span { flex: 1 1 0; }

  /* Prévia do site. Não é screenshot — é uma placa com o domínio real, no tom
     derivado dele. Serve pro card ter capa e pro site ser reconhecido de
     relance, sem depender de rede. */
  .preview { display: flex; flex-direction: column; gap: 9px; padding: 10px; position: relative; }
  .preview-bar { display: flex; align-items: center; gap: 6px; flex: none; }
  .preview-dots { display: flex; gap: 3px; flex: none; }
  .preview-dots i { width: 5px; height: 5px; border-radius: 999px; background: currentColor; opacity: 0.3; }
  .preview-url {
    flex: 1; min-width: 0;
    padding: 3px 8px;
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 9.5px;
    line-height: 1.5;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .preview-body {
    flex: 1;

<script>
(() => {
  "use strict";

  /* ═══════════════════════════════ util ═══════════════════════════ */

  const $ = (id) => document.getElementById(id);

  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (value === undefined || value === null || value === false) continue;
      if (key === "class") node.className = value;
      else if (key === "text") node.textContent = value;
      else if (key === "html") node.innerHTML = value;
      else if (key === "style") node.setAttribute("style", value);
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else if (key === "dataset") Object.assign(node.dataset, value);
      else node.setAttribute(key, value === true ? "" : String(value));
    }
    for (const child of [].concat(children)) {
      if (child === null || child === undefined || child === false) continue;
      node.append(typeof child === "string" ? document.createTextNode(child) : child);
    }
    return node;
  }

  const svg = (paths, size = 16) =>
    el("span", { class: "ico", "aria-hidden": "true",
      html: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>` });

  const ICON = {
    board: '<rect x="3" y="3.5" width="7.5" height="10" rx="1.6"/><rect x="13.5" y="3.5" width="7.5" height="6" rx="1.6"/><rect x="3" y="16.5" width="7.5" height="4" rx="1.6"/><rect x="13.5" y="12.5" width="7.5" height="8" rx="1.6"/>',
    star: '<path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.6 9.7l5.8-.8z"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/>',
    tag: '<path d="M3.5 11.2V4.8c0-.7.6-1.3 1.3-1.3h6.4c.4 0 .7.1 1 .4l8 8c.5.5.5 1.3 0 1.8l-6.4 6.4c-.5.5-1.3.5-1.8 0l-8-8a1.4 1.4 0 0 1-.5-1z"/><circle cx="8" cy="8" r="1.3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    link: '<path d="M10.5 13.5a4 4 0 0 0 5.7 0l2.8-2.8a4 4 0 0 0-5.7-5.7l-1.6 1.6"/><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-2.8 2.8a4 4 0 1 0 5.7 5.7l1.6-1.6"/>',
    note: '<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3h8L19 7.5v12A1.5 1.5 0 0 1 17.5 21h-11A1.5 1.5 0 0 1 5 19.5z"/><path d="M14 3v5h5M8.5 13h7M8.5 16.5h4.5"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 17 4.5-4.5a2 2 0 0 1 2.8 0L20 20"/>',
    external: '<path d="M7 17 17 7M8.5 7H17v8.5"/>',
    trash: '<path d="M4 6.5h16M9.5 6.5V4.8c0-.7.6-1.3 1.3-1.3h2.4c.7 0 1.3.6 1.3 1.3v1.7"/><path d="M6.5 6.5 7.4 19a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5l.9-12.5"/>',
    close: '<path d="m6 6 12 12M18 6 6 18"/>',
    chevron: '<path d="m9.5 5.5 6.5 6.5-6.5 6.5"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 6.5v-1A1.5 1.5 0 0 0 13.5 4h-8A1.5 1.5 0 0 0 4 5.5v8A1.5 1.5 0 0 0 5.5 15h1"/>',
    edit: '<path d="M4 20h4l10-10a2.4 2.4 0 0 0-3.4-3.4L4.6 16.6z"/><path d="m14 7 3 3"/>',
    spark: '<path d="M12 3.5 13.7 9l5.5 1.7-5.5 1.7L12 18l-1.7-5.6L4.8 10.7 10.3 9z"/><path d="M18.5 16.5 19.2 18.5 21 19.2 19.2 20 18.5 22 17.8 20 16 19.2 17.8 18.5z"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/>',
    palette: '<path d="M12 3.5a8.5 8.5 0 1 0 0 17c.9 0 1.6-.7 1.6-1.6 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6h1.9a4.2 4.2 0 0 0 4.2-4.2c0-4.1-3.8-7.4-8.5-7.4z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10" cy="7.5" r="1.2"/><circle cx="14.5" cy="7.8" r="1.2"/>',
    download: '<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M4.5 18.5v.5A1.5 1.5 0 0 0 6 20.5h12a1.5 1.5 0 0 0 1.5-1.5v-.5"/>',
    upload: '<path d="M12 20V9M7.5 13.5 12 9l4.5 4.5"/><path d="M4.5 6.5V6A1.5 1.5 0 0 1 6 4.5h12A1.5 1.5 0 0 1 19.5 6v.5"/>',
    mural: '<rect x="3.5" y="3.5" width="7" height="9" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.4"/><rect x="3.5" y="15.5" width="7" height="5" rx="1.4"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.4"/>',
    grade: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/>',
    lista: '<path d="M4 6.5h16M4 12h16M4 17.5h16"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>',
    moon: '<path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.2 8.2 0 1 0 20 14.2"/>',
    folder: '<path d="M3.5 7.2c0-1 .8-1.7 1.7-1.7h3.6c.5 0 1 .2 1.3.6l1.2 1.4h7.5c1 0 1.7.8 1.7 1.7v8.6c0 1-.8 1.7-1.7 1.7H5.2c-1 0-1.7-.8-1.7-1.7z"/>',
  };

  const uid = () =>
    crypto.randomUUID ? crypto.randomUUID()
      : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);

  const deaccent = (v) => v.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  const slugifyTag = (raw) =>
    deaccent(raw).trim().replace(/[^a-z0-9\s-]/g, "").replace(/\s+/g, "-").replace(/-+/g, "-").slice(0, 32);

  function hostOf(url) {
    if (!url) return "";
    try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return ""; }
  }

  function normalizeUrl(raw) {
    const trimmed = raw.trim();
    if (!trimmed) return null;
    const explicit = /^https?:\/\//i.test(trimmed);
    if (!explicit && !looksLikeDomain(trimmed)) return null;
    const candidate = explicit ? trimmed : "https://" + trimmed;
    try {
      const url = new URL(candidate);
      return url.hostname.includes(".") ? url.toString() : null;
    } catch { return null; }
  }

  /** Extensões de arquivo que parecem domínio: "index.html" e "Node.js" não são sites. */
  const FILE_EXTENSIONS = new Set(["js", "ts", "tsx", "jsx", "md", "txt", "html", "htm", "css", "json",
    "png", "jpg", "jpeg", "gif", "svg", "webp", "pdf", "py", "zip", "mp3", "mp4", "mov", "doc", "docx",
    "xls", "xlsx", "ppt", "pptx", "csv", "fig", "sketch", "psd", "ai", "exe", "sh", "yml", "yaml"]);

  /**
   * Um endereço sem "https://" só conta como site se terminar num domínio de
   * topo de letras ("stripe.com", "warren.com.br/gestao"). "3.14" e "v2.0"
   * ficam de fora (o navegador leria "3.14" como o IP 3.0.0.14), e "Node.js"
   * ou "index.html" também.
   */
  function looksLikeDomain(text) {
    const match = /^([\w-]+(?:\.[\w-]+)+)([/?#].*)?$/.exec(String(text).trim());
    if (!match) return false;
    const labels = match[1].toLowerCase().split(".");
    const tld = labels[labels.length - 1];
    if (!/^[a-z]{2,24}$/.test(tld)) return false;
    // "www.site.js" é site; "Node.js" sozinho, sem www nem caminho, é arquivo.
    return !FILE_EXTENSIONS.has(tld) || labels[0] === "www" || Boolean(match[2]);
  }

  function extractUrls(text) {
    const found = text.match(/https?:\/\/[^\s<>"',]+/gi);
    if (found && found.length) return found.map(trimUrlTail);
    return text.split(/[\n,]/).map((l) => l.trim()).filter(looksLikeDomain);
  }

  /**
   * Tira do fim do link a pontuação da frase em volta: "veja https://a.com."
   * e "(https://a.com)". Parêntese só sai quando sobra sem par — o de
   * "wiki/Mercury_(planet)" é do endereço.
   */
  function trimUrlTail(url) {
    let out = url.replace(/[.,;:!?]+$/, "");
    while (out.endsWith(")") && (out.match(/\(/g) || []).length < (out.match(/\)/g) || []).length) {
      out = out.slice(0, -1).replace(/[.,;:!?]+$/, "");
    }
    return out;
  }

  /** O que sobra do texto colado depois de tirar os links; vazio se for só link. */
  function textBesideUrls(text, urls) {
    let rest = text;
    for (const url of urls) rest = rest.split(url).join(" ");
    rest = rest.replace(/\s+/g, " ").trim();
    return /[\p{L}\p{N}]{2,}/u.test(rest) ? rest : "";
  }

  const RELATIVE = [
    [60000, 1000, "second"], [3600000, 60000, "minute"], [86400000, 3600000, "hour"],
    [604800000, 86400000, "day"], [2629800000, 604800000, "week"],
    [31557600000, 2629800000, "month"], [Infinity, 31557600000, "year"],
  ];

  function timeAgo(ts) {
    const delta = ts - Date.now();
    if (Math.abs(delta) < 45000) return "agora";
    const fmt = new Intl.RelativeTimeFormat("pt-BR", { numeric: "auto" });
    for (const [limit, div, unit] of RELATIVE) {
      // Arredonda antes de escolher a unidade: 59 min 40 s é "há 1 hora",
      // não "há 60 minutos".
      if (Math.abs(Math.round(delta / div)) < limit / div) return fmt.format(Math.round(delta / div), unit);
    }
    return "";
  }

  const formatDate = (ts) =>
    new Intl.DateTimeFormat("pt-BR", { day: "2-digit", month: "short", year: "numeric" }).format(ts);

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + " B";
    const units = ["KB", "MB", "GB"];
    let value = bytes / 1024, i = 0;
    while (value >= 1023.5 && i < units.length - 1) { value /= 1024; i++; }
    return value.toFixed(value < 10 ? 1 : 0) + " " + units[i];
  }

  /* ═══════════════════════════ cores ══════════════════════════════ */

  const HEX_TOKEN = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i;

  function normalizeHex(raw) {
    const match = String(raw).trim().match(HEX_TOKEN);
    if (!match) return null;
    let hex = match[1].toLowerCase();
    if (hex.length === 3) hex = hex.split("").map((c) => c + c).join("");
    return "#" + hex;
  }

  /**
   * Reconhece um texto que é só cores: "#d97757 #c9a227", uma por linha,
   * separadas por vírgula, com ou sem "#". Devolve null se qualquer pedaço
   * não for cor — assim uma nota comum nunca vira paleta por engano.
   */
  function parsePalette(text) {
    const tokens = String(text).split(/[\s,;|]+/).filter(Boolean);
    if (!tokens.length || tokens.length > 24) return null;

    const colors = [];
    for (const token of tokens) {
      const hex = normalizeHex(token);
      if (!hex) return null;
      if (!colors.includes(hex)) colors.push(hex);
    }

    // Uma cor só de 3 dígitos é ambígua demais (#abc parece uma tag), então
    // exige forma completa quando é a única.
    if (colors.length === 1 && !/^#?[0-9a-f]{6}$/i.test(tokens[0].replace(/^#/, ""))) {
      return null;
    }
    // Palavras feitas só de letras de a a f ("decade", "add bad bed") não são
    // cores: pelo menos um pedaço precisa ter "#" ou um número.
    if (!tokens.some((token) => /[#0-9]/.test(token))) return null;
    return colors;
  }

  function hexToRgb(hex) {
    const value = normalizeHex(hex) || "#000000";
    return {
      r: parseInt(value.slice(1, 3), 16),
      g: parseInt(value.slice(3, 5), 16),
      b: parseInt(value.slice(5, 7), 16),
    };
  }

  function hexToHsl(hex) {
    const { r, g, b } = hexToRgb(hex);
    const [rn, gn, bn] = [r / 255, g / 255, b / 255];
    const max = Math.max(rn, gn, bn), min = Math.min(rn, gn, bn);
    const l = (max + min) / 2;
    if (max === min) return { h: 0, s: 0, l };
    const d = max - min;
    const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    let h;
    if (max === rn) h = ((gn - bn) / d + (gn < bn ? 6 : 0)) / 6;
    else if (max === gn) h = ((bn - rn) / d + 2) / 6;
    else h = ((rn - gn) / d + 4) / 6;
    return { h: h * 360, s, l };
  }

  const HUE_NAMES = [
    // 12° e não 15°: terracota (#d97757) cai em 14,8° e lê como laranja.
    [12, "vermelho"], [45, "laranja"], [70, "amarelo"], [160, "verde"],
    [200, "turquesa"], [250, "azul"], [290, "violeta"], [335, "rosa"], [361, "vermelho"],
  ];

  function colorName(hex) {
    const { h, s, l } = hexToHsl(hex);
    if (l < 0.08) return "preto";
    if (l > 0.94 && s < 0.1) return "branco";
    if (s < 0.12) return "cinza";
    const base = HUE_NAMES.find(([limit]) => h < limit)[1];
    if (l < 0.28) return base + " escuro";
    if (l > 0.75) return base + " claro";
    return base;
  }

  /** Preto ou branco por cima do swatch, o que tiver mais contraste. */
  function readableOn(hex) {
    const { r, g, b } = hexToRgb(hex);
    // luminância relativa, como na fórmula de contraste da WCAG
    const channel = (c) => {
      const v = c / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    };
    const luminance = 0.2126 * channel(r) + 0.7152 * channel(g) + 0.0722 * channel(b);
    return luminance > 0.42 ? "#101014" : "#ffffff";
  }

  /**
   * O nome que as paletas tinham antes: "Paleta laranja · 3 cores". Duas
   * paletas laranjas ficavam com o mesmo nome — é por isso que ele saiu.
   */
  const OLD_PALETTE_TITLE = /^(paleta (vermelho|laranja|amarelo|verde|turquesa|azul|violeta|rosa|preto|branco|cinza)( escuro| claro)? · \d+ cores|cor (vermelho|laranja|amarelo|verde|turquesa|azul|violeta|rosa|preto|branco|cinza)( escuro| claro)?)$/i;

  /** A primeira palavra puxa pelo tom da primeira cor; a segunda é sorte. */
  const PALETTE_WORDS = {
    quente: ["Brasa", "Cobre", "Argila", "Terracota", "Pimenta", "Urucum", "Telha", "Caju", "Fogueira", "Ferrugem"],
    sol: ["Mel", "Girassol", "Ipê", "Manga", "Açafrão", "Trigo", "Fubá", "Dendê"],
    verde: ["Musgo", "Mangue", "Folha", "Cerrado", "Samambaia", "Erva", "Jade", "Oliva"],
    agua: ["Maré", "Lagoa", "Bruma", "Anil", "Restinga", "Garoa", "Orvalho", "Mar"],
    flor: ["Lavanda", "Orquídea", "Jabuticaba", "Hibisco", "Ameixa", "Açaí", "Buganvília", "Amora"],
    neutro: ["Linho", "Areia", "Pedra", "Seda", "Concha", "Neblina", "Grafite", "Barro"],
  };
  const PALETTE_PLACES = [
    "de Outono", "de Verão", "de Inverno", "de Março", "de Agosto", "de Domingo",
    "da Manhã", "da Tarde", "da Serra", "do Quintal", "da Varanda", "da Feira",
    "do Litoral", "de Olinda", "de Paraty", "do Sertão", "de Lisboa", "do Cais",
    "da Praia", "do Ateliê",
  ];

  function paletteFamily(hex) {
    const { h, s, l } = hexToHsl(hex || "#808080");
    if (s < 0.12 || l < 0.08 || l > 0.94) return "neutro";
    if (h < 45 || h >= 335) return "quente";
    if (h < 70) return "sol";
    if (h < 160) return "verde";
    if (h < 250) return "agua";
    return "flor";
  }

  /**
   * Um nome sorteado pra paleta — "Brasa de Outono", "Maré do Cais" — que
   * nenhuma outra referência do acervo use. Duas paletas laranjas deixam de
   * se chamar igual.
   */
  function paletteTitle(colors, taken = new Set(state.items.map((item) => lower(item.title)))) {
    const firsts = PALETTE_WORDS[paletteFamily(colors[0])];
    const pick = (list) => list[Math.floor(Math.random() * list.length)];
    for (let attempt = 0; attempt < 60; attempt++) {
      const name = pick(firsts) + " " + pick(PALETTE_PLACES);
      if (!taken.has(lower(name))) return name;
    }
    const base = pick(firsts) + " " + pick(PALETTE_PLACES);
    let n = 2;
    while (taken.has(lower(`${base} ${n}`))) n++;
    return `${base} ${n}`;
  }

  /** "hsl" com 0–360, 0–100, 0–100 → "#rrggbb", que aceita sufixo de opacidade. */
  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = (n) => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    return "#" + [f(0), f(8), f(4)].map((x) => Math.round(x * 255).toString(16).padStart(2, "0")).join("");
  }

  function hashOf(value) {
    let hash = 0;
    for (let i = 0; i < value.length; i++) hash = (hash * 31 + value.charCodeAt(i)) | 0;
    return Math.abs(hash);
  }

  /**
   * Um tom estável pra cada texto, em hex: quem usa soma a opacidade no fim
   * (`${base}22`). Em hsl() esse sufixo invalidava a cor inteira e o fundo
   * das capas sumia sem aviso.
   */
  function colorFromString(value, shift = 0) {
    return hslToHex(((hashOf(String(value)) % 360) + shift + 360) % 360, 42, 46);
  }

  /* ═════════════════════════ busca fuzzy ══════════════════════════ */

  const isBoundary = (text, i) => i === 0 || /[\s\-_/.:|]/.test(text[i - 1]);

  function fuzzy(query, target) {
    if (!query) return 0;
    const hay = deaccent(target || ""), needle = deaccent(query);
    if (!hay) return null;

    const direct = hay.indexOf(needle);
    if (direct !== -1) {
      let score = Math.max(1, 120 - direct);
      if (direct === 0) score += 60; else if (isBoundary(hay, direct)) score += 30;
      return score;
    }

    let score = 0, cursor = 0, previous = -1;
    for (const char of needle) {
      if (char === " ") continue;
      const index = hay.indexOf(char, cursor);
      if (index === -1) return null;
      if (index === previous + 1) score += 8;
      if (isBoundary(hay, index)) score += 12;
      score += Math.max(0, 6 - (index - cursor));
      previous = index;
      cursor = index + 1;
    }
    return score + Math.max(0, 20 - hay.length / 6);
  }

  function searchItems(items, query) {
    const trimmed = query.trim();
    if (!trimmed) return items.slice();

    const scored = [];
    for (const item of items) {
      const title = fuzzy(trimmed, item.title);
      let score = title ? title * 3 : 0;
      for (const tag of item.tags) {
        const hit = fuzzy(trimmed, tag);
        if (hit) score = Math.max(score, hit * 2.4);
      }
      const host = hostOf(item.url);
      if (host) { const hit = fuzzy(trimmed, host); if (hit) score = Math.max(score, hit * 1.8); }
      // paleta é procurada pelo próprio hex e pelo nome da cor
      for (const color of item.colors || []) {
        if (color.includes(deaccent(trimmed).replace(/^#?/, "#"))) score = Math.max(score, 110);
        const named = fuzzy(trimmed, colorName(color));
        if (named) score = Math.max(score, named * 1.6);
      }
      const long = ((item.description || "") + " " + (item.notes || "")).trim();
      if (long && deaccent(long).includes(deaccent(trimmed))) score = Math.max(score, 70);
      if (score > 0) scored.push({ item, score });
    }
    return scored
      .sort((a, b) => b.score - a.score || b.item.updatedAt - a.item.updatedAt)
      .map((s) => s.item);
  }

  /* ═══════════════════════ tags automáticas ═══════════════════════ */

  const DOMAIN_TAGS = {
    "dribbble.com": ["ui", "inspiracao"], "behance.net": ["design", "portfolio"],
    "figma.com": ["figma", "ui"], "awwwards.com": ["web", "inspiracao"],
    "godly.website": ["web", "inspiracao"], "land-book.com": ["landing-page", "web"],
    "mobbin.com": ["mobile", "ui"], "pinterest.com": ["inspiracao"],
    "unsplash.com": ["foto"], "pexels.com": ["foto"], "youtube.com": ["video"],
    "youtu.be": ["video"], "vimeo.com": ["video"], "github.com": ["codigo", "open-source"],
    "stackoverflow.com": ["codigo"], "codepen.io": ["codigo", "front-end"],
    "medium.com": ["artigo"], "substack.com": ["newsletter"], "notion.so": ["doc"],
    "linkedin.com": ["social"], "x.com": ["social"], "twitter.com": ["social"],
    "instagram.com": ["social"], "tiktok.com": ["social", "video"],
    "producthunt.com": ["produto"], "webflow.com": ["web", "no-code"],
    "framer.com": ["web", "no-code"], "fonts.google.com": ["tipografia"],
    "fontshare.com": ["tipografia"], "coolors.co": ["cor"], "arxiv.org": ["pesquisa"],
  };

  // Cada alternativa fica entre \b(?: … )\b: sem o grupo, "app" casava dentro
  // de "whatsapp" e "ios" dentro de "comentários".
  const KEYWORD_TAGS = [
    [/\b(?:landing\s?page|lp)\b/, "landing-page"], [/\bdesign\s?system\b/, "design-system"],
    [/\b(?:dashboard|painel)\b/, "dashboard"], [/\bonboarding\b/, "onboarding"],
    [/\b(?:checkout|carrinho)\b/, "checkout"], [/\b(?:pricing|preco|planos)\b/, "pricing"],
    [/\b(?:email|newsletter)\b/, "email"], [/\b(?:copy(?:writing)?|headline)\b/, "copy"],
    [/\b(?:brand(?:ing)?|marca)\b/, "branding"], [/\blogo\b/, "logo"],
    [/\b(?:tipografia|typography|font(?:e|s)?)\b/, "tipografia"], [/\b(?:palet(?:a|te)s?|cor(?:es)?)\b/, "cor"],
    [/\bilustra(?:cao|tion)\b/, "ilustracao"], [/\b(?:anima(?:cao|tion)|motion)\b/, "animacao"],
    [/\b(?:3d|blender)\b/, "3d"], [/\b(?:icones?|icons?|iconset)\b/, "icone"],
    [/\b(?:mobile|app|ios|android)\b/, "mobile"], [/\bux\b/, "ux"], [/\bui\b/, "ui"],
    [/\b(?:acessibilidade|accessibility|a11y)\b/, "acessibilidade"],
    [/\b(?:tutorial|como fazer|how to)\b/, "tutorial"], [/\b(?:case study|estudo de caso)\b/, "case"],
    [/\bportfolio\b/, "portfolio"], [/\bia\b/, "ia"], [/\bprompt\b/, "prompt"],
    [/\bsaas\b/, "saas"], [/\b(?:fintech|investimento|financ(?:as|eiro))\b/, "financas"],
    [/\b(?:marketing|growth|funil)\b/, "marketing"], [/\b(?:video|reels?|shorts?)\b/, "video"],
    [/\b(?:apresenta(?:cao|tion)|slides?|deck)\b/, "apresentacao"],
  ];

  function suggestTags({ url, title, description }, limit = 5) {
    const tags = new Set();
    const host = hostOf(url);
    if (host) {
      for (const [domain, list] of Object.entries(DOMAIN_TAGS)) {
        if (host === domain || host.endsWith("." + domain)) list.forEach((t) => tags.add(t));
      }
    }
    const raw = [title, description].filter(Boolean).join(" ");
    const hay = deaccent(raw);
    for (const [pattern, tag] of KEYWORD_TAGS) {
      if (tags.size >= limit) break;
      if (pattern.test(hay)) tags.add(tag);
    }
    // "AI" em inglês vira "ia" — mas só olhando o texto com acento, senão o
    // "aí" de toda frase em português ("e aí", "por aí") virava "ia" também.
    if (tags.size < limit && /(^|[^\p{L}])ai($|[^\p{L}])/u.test(raw.toLowerCase())) tags.add("ia");
    if (tags.size === 0 && host) {
      // "uol.com.br" dá "uol", não "com".
      const parts = host.split(".");
      let root = parts.length > 1 ? parts[parts.length - 2] : parts[0];
      if (parts.length > 2 && /^(com|org|gov|net|edu|co|ac)$/.test(root)) root = parts[parts.length - 3];
      if (root) tags.add(slugifyTag(root));
    }
    return [...tags].slice(0, limit);
  }

  /* ═══════════════════════════ IndexedDB ══════════════════════════ */

  const DB_NAME = "referencias-demo";
  const S_ITEMS = "items", S_BOARDS = "boards", S_PREFS = "prefs";
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(S_ITEMS)) db.createObjectStore(S_ITEMS, { keyPath: "id" });
        if (!db.objectStoreNames.contains(S_BOARDS)) db.createObjectStore(S_BOARDS, { keyPath: "id" });
        if (!db.objectStoreNames.contains(S_PREFS)) db.createObjectStore(S_PREFS);
      };
      request.onsuccess = () => { request.result.onversionchange = () => request.result.close(); resolve(request.result); };
      request.onerror = () => reject(request.error);
    });
    return dbPromise;
  }

  const wrap = (request) => new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });

  async function dbAll(store) {
    const db = await openDB();
    return wrap(db.transaction(store, "readonly").objectStore(store).getAll());
  }
  async function dbGet(store, key) {
    const db = await openDB();
    return wrap(db.transaction(store, "readonly").objectStore(store).get(key));
  }

  /**
   * Uma escrita só vale quando a transação fecha. Disco cheio aparece como
   * `abort` no commit, depois de o pedido já ter dado sucesso — esperar só o
   * pedido diria "salvo" pra algo que não foi.
   */
  async function writeTx(store, run) {
    const db = await openDB();
    const tx = db.transaction(store, "readwrite");
    run(tx.objectStore(store));
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error("A gravação no navegador foi cancelada"));
    });
  }

  const rawPut = (store, value, key) =>
    writeTx(store, (os) => (key === undefined ? os.put(value) : os.put(value, key)));
  async function rawPutMany(store, values) {
    if (!values.length) return;
    return writeTx(store, (os) => values.forEach((v) => os.put(v)));
  }
  const rawDelete = (store, key) => writeTx(store, (os) => os.delete(key));
  async function rawClear(store) {
    return writeTx(store, (os) => os.clear());
  }

  /**
   * O banco do navegador é a escrita imediata; a pasta do acervo é a que
   * sobrevive a ele. Agendar a gravação aqui, e não em cada ação, é o que
   * garante que nada escape do disco — inclusive o que for adicionado depois.
   */
  const tapVault = (result) => { scheduleVaultSave(); return result; };

  const dbPut = (store, value, key) => rawPut(store, value, key).then(tapVault);
  const dbPutMany = (store, values) => rawPutMany(store, values).then(tapVault);
  const dbDelete = (store, key) => rawDelete(store, key).then(tapVault);
  const dbClear = (store) => rawClear(store).then(tapVault);

  /* ═════════════════════════ estado global ════════════════════════ */

  const state = {
    ready: false,
    items: [],
    boards: [],
    selection: { type: "todos" },
    query: "",
    kinds: [],
    view: "mural",
    sort: "recentes",
    theme: null,
    focusedId: null,
    detailId: null,
    railOpen: false,
  };

  const BOARD_COLORS = ["#d97757", "#c9a227", "#5b9279", "#4a86c5", "#8a6fc4", "#c4699a", "#7d8a99"];
  const BOARD_EMOJIS = ["🎨","💡","📐","🧩","🖼️","✍️","🎬","🎧","📊","🧪","🚀","🏷️","🧠","📦","🌱","⚡","🔭","🗂️","🪄","🧭"];
  const KIND_LABEL = { link: "Links", image: "Imagens", note: "Notas", palette: "Paletas" };
  const SORT_LABEL = { recentes: "Mais recentes", antigos: "Mais antigos", titulo: "Título (A–Z)", abertos: "Abertos por último" };

  const blobUrls = new Map();
  function coverUrl(item) {
    if (!item.imageBlob) return null;
    if (!blobUrls.has(item.id)) blobUrls.set(item.id, URL.createObjectURL(item.imageBlob));
    return blobUrls.get(item.id);
  }
  function releaseCover(id) {
    const url = blobUrls.get(id);
    if (url) { URL.revokeObjectURL(url); blobUrls.delete(id); }
  }

  /* ═══════════════════════════ persistência ═══════════════════════ */

  async function persistPrefs() {
    await dbPut(S_PREFS, {
      view: state.view, sort: state.sort, theme: state.theme, onboarded: true,
    }, "app");
  }

  async function createItem(input) {
    const now = Date.now();
    const item = Object.assign(
      { favorite: false, tags: [], boardIds: [] }, input,
      { id: input.id || uid(), createdAt: input.createdAt || now, updatedAt: now },
    );
    state.items.unshift(item);
    await dbPut(S_ITEMS, item);
    return item;
  }

  async function createItems(inputs) {
    const now = Date.now();
    const items = inputs.map((input, i) => Object.assign(
      { favorite: false, tags: [], boardIds: [] }, input,
      { id: input.id || uid(), createdAt: input.createdAt || now - i, updatedAt: now - i },
    ));
    state.items.unshift(...items);
    await dbPutMany(S_ITEMS, items);
    return items;
  }

  async function updateItem(id, patch) {
    const index = state.items.findIndex((i) => i.id === id);
    if (index === -1) return;
    const next = Object.assign({}, state.items[index], patch, { id, updatedAt: Date.now() });
    state.items[index] = next;
    await dbPut(S_ITEMS, next);
    return next;
  }

  async function touchOpened(id) {
    const index = state.items.findIndex((i) => i.id === id);
    if (index === -1) return;
    const next = Object.assign({}, state.items[index], { openedAt: Date.now() });
    state.items[index] = next;
    await dbPut(S_ITEMS, next);
  }

  async function deleteItem(id) {
    state.items = state.items.filter((i) => i.id !== id);
    releaseCover(id);
    await dbDelete(S_ITEMS, id);
  }

  async function createBoard(values) {
    const now = Date.now();
    const board = Object.assign({}, values, {
      id: uid(), position: state.boards.length, createdAt: now, updatedAt: now,
    });
    state.boards.push(board);
    sortBoards();
    await dbPut(S_BOARDS, board);
    return board;
  }

  async function updateBoard(id, patch) {
    const index = state.boards.findIndex((b) => b.id === id);
    if (index === -1) return;
    state.boards[index] = Object.assign({}, state.boards[index], patch, { id, updatedAt: Date.now() });
    sortBoards();
    await dbPut(S_BOARDS, state.boards.find((b) => b.id === id));
  }

  async function deleteBoard(id) {
    state.boards = state.boards.filter((b) => b.id !== id);
    const touched = [];
    state.items = state.items.map((item) => {
      if (!item.boardIds.includes(id)) return item;
      const next = Object.assign({}, item, {
        boardIds: item.boardIds.filter((b) => b !== id), updatedAt: Date.now(),
      });
      touched.push(next);
      return next;
    });
    await dbDelete(S_BOARDS, id);
    await dbPutMany(S_ITEMS, touched);
  }

  const sortBoards = () =>
    state.boards.sort((a, b) => a.position - b.position || a.createdAt - b.createdAt);

  /* ═══════════════════════ pasta do acervo ════════════════════════ */

  /**
   * O acervo espelhado numa pasta de verdade do computador, escrita pelo
   * próprio navegador (File System Access API):
   *
   *   A pasta que você escolher/
   *   ├─ acervo.json              o acervo agora, regravado a cada alteração
   *   ├─ acervo-anterior.json     a cópia que você salva no botão
   *   ├─ historico/               uma versão por dia de uso, guardada sozinha
   *   └─ imagens/<título>.webp    uma imagem por referência, com o nome dela
   *
   * Não é export nem backup: a pasta é regravada sozinha a cada alteração e
   * relida na abertura seguinte. É o que faz o acervo sobreviver a limpar os
   * dados do navegador, trocar de perfil ou formatar a máquina — o IndexedDB
   * vira só o cache rápido de algo que já está em disco.
   */

  const VAULT_KEY = "vault";
  const VAULT_FILE = "acervo.json";
  /**
   * A cópia que você salva no botão — e só ela mexe nesse arquivo.
   *
   * `acervo.json` acompanha o acervo em tempo real, com tudo que isso implica:
   * uma exclusão chega nele em um segundo. Este aqui é o ponto de retorno que
   * você escolheu, e fica congelado até você escolher outro.
   */
  const VAULT_RESCUE = "acervo-anterior.json";
  /**
   * As versões que ninguém precisa lembrar de salvar. Na primeira gravação de
   * cada dia, a versão com que o acervo fechou o último dia de uso vem pra cá
   * antes de ser sobrescrita; "Limpar acervo" deixa uma aqui também. A cópia
   * manual sozinha não bastava: ela só guarda o que alguém lembrou de salvar.
   */
  const VAULT_HISTORY = "historico";
  const HISTORY_KEEP = 30;
  const VAULT_IMAGES = "imagens";
  const VAULT_FORMAT = "referencias/acervo";
  const IMAGE_EXTS = [".webp", ".png", ".jpg", ".jpeg", ".gif", ".svg"];
  const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  const vault = {
    dir: null,
    name: "",
    /** off | saving | ready | permission | error | unsupported */
    status: typeof window.showDirectoryPicker === "function" ? "off" : "unsupported",
    /** Carimbo da última gravação nossa — desempata quem escreveu por último. */
    stamp: "",
    savedAt: 0,
    error: "",
    persisted: false,
    /** Resumo da cópia salva: { items, boards, savedAt }. */
    rescue: null,
    /** De quem é cada arquivo de imagens/: id da referência → nome do arquivo. */
    index: new Map(),
    /** Referências citadas por alguma versão guardada: id → { title, image }. `null` = reler. */
    kept: null,
    /** As versões guardadas na pasta, a cópia manual primeiro e depois da mais nova pra mais antiga. */
    versions: [],
    /** O dia (AAAA-MM-DD) cuja versão anterior já foi conferida nesta sessão. */
    historyDay: "",
  };

  const vaultSupported = () => vault.status !== "unsupported";
  const vaultOn = () => Boolean(vault.dir);

  function resetVaultMemory() {
    vault.index = new Map();
    vault.kept = null;
    vault.versions = [];
    vault.historyDay = "";
    vault.rescue = null;
  }

  /* ── nomes ───────────────────────────────────────────────────────── */

  const lower = (name) => String(name || "").toLowerCase();
  const baseName = (path) => String(path || "").split("/").pop();
  const stemOf = (name) => String(name || "").replace(/\.[^.]+$/, "");
  const extOf = (name) => { const match = /\.[a-z0-9]+$/i.exec(name || ""); return match ? match[0].toLowerCase() : ""; };

  const localDay = (ts) => {
    const date = new Date(ts);
    return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0")
      + "-" + String(date.getDate()).padStart(2, "0");
  };

  const UNNAMED_IMAGE = "Imagem sem nome";

  /**
   * Nome que veio de máquina, não de gente: o hash que o Pinterest dá aos
   * arquivos, o id com que o app nomeava as imagens na pasta, o "image.png" de
   * um print colado. Nada disso diz o que a imagem é.
   */
  function isMachineName(raw) {
    const name = String(raw || "").trim();
    if (!name) return true;
    return /^[0-9a-f]{16,}$/i.test(name)
      || /^[0-9a-f]{8}[\s_-][0-9a-f]{4}[\s_-][0-9a-f]{4}[\s_-][0-9a-f]{4}[\s_-][0-9a-f]{12}$/i.test(name)
      || /^\d{8,}$/.test(name)
      || /^(image|imagem|img|unnamed|untitled|download|sem t[ií]tulo)(\s*\(\d+\))?$/i.test(name);
  }

  /** O título de uma imagem nova: o nome do arquivo, quando ele diz alguma coisa. */
  function imageTitleFromFile(file) {
    const name = stemOf(file.name || "").replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim();
    return isMachineName(name) ? UNNAMED_IMAGE : name;
  }

  /** O título como nome de arquivo que Windows, macOS e as nuvens aceitam. */
  function fileBaseFor(title) {
    let base = String(title || "").normalize("NFC")
      .replace(/[\u0000-\u001f\u007f<>:"/\\|?*]+/g, " ")
      .replace(/\s+/g, " ").trim()
      .replace(/^[.\s]+/, "").replace(/[.\s]+$/, "");
    if (isMachineName(base)) base = UNNAMED_IMAGE;
    const chars = [...base];
    if (chars.length > 80) base = chars.slice(0, 80).join("").replace(/[.\s]+$/, "");
    // Nomes que o Windows reserva pra dispositivos, com ou sem extensão.
    if (/^(con|prn|aux|nul|com\d|lpt\d)$/i.test(base)) base += " (imagem)";
    return base || UNNAMED_IMAGE;
  }

  function imageExt(blob) {
    const type = (blob && blob.type) || "";
    return type === "image/png" ? ".png" : type === "image/jpeg" ? ".jpg"
      : type === "image/gif" ? ".gif" : type === "image/svg+xml" ? ".svg" : ".webp";
  }

  /** "Logo.webp" e "Logo (3).webp" combinam com o título "Logo". */
  function fitsName(name, base, ext) {
    const full = lower(name), wanted = lower(base), suffix = lower(ext);
    if (!full.endsWith(suffix)) return false;
    const stem = full.slice(0, full.length - suffix.length);
    if (stem === wanted) return true;
    const escaped = wanted.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return new RegExp("^" + escaped + " \\(\\d+\\)$").test(stem);
  }

  /**
   * Um nome de arquivo pra cada imagem, a partir do título. Quem já tem um
   * nome que combina com o título fica com ele — apagar ou renomear uma
   * referência não sai renomeando as irmãs. Nome ocupado por arquivo de outra
   * referência (ou por algo que alguém pôs na pasta) nunca é reaproveitado:
   * sobrescrevê-lo seria trocar a imagem de outra pessoa.
   */
  function assignImageNames(entries, onDisk, owner, reserved = new Set()) {
    const names = new Map();
    const used = new Set(reserved);
    const free = (name, id) => !used.has(lower(name))
      && (!onDisk.has(lower(name)) || owner.get(lower(name)) === id);

    for (const entry of entries) {
      const base = fileBaseFor(entry.title);
      if (entry.current && fitsName(entry.current, base, entry.ext) && free(entry.current, entry.id)) {
        names.set(entry.id, entry.current);
        used.add(lower(entry.current));
      }
    }

    // O restante por ordem de chegada: a imagem mais antiga fica com o nome
    // sem número, as seguintes ganham (2), (3)…
    const pending = entries.filter((entry) => !names.has(entry.id))
      .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    for (const entry of pending) {
      const base = fileBaseFor(entry.title);
      let name = base + entry.ext;
      for (let n = 2; !free(name, entry.id); n++) name = `${base} (${n})${entry.ext}`;
      names.set(entry.id, name);
      used.add(lower(name));
    }
    return names;
  }

  /* ── permissão ───────────────────────────────────────────────────── */

  async function ensureVaultAccess(interactive = false) {
    if (!vault.dir) return false;
    if (typeof vault.dir.queryPermission !== "function") return true;
    const options = { mode: "readwrite" };
    if ((await vault.dir.queryPermission(options)) === "granted") return true;
    // Pedir de novo só funciona dentro de um clique; fora dele o navegador
    // recusa sem nem mostrar o aviso.
    if (interactive && (await vault.dir.requestPermission(options)) === "granted") return true;
    setVaultStatus("permission");
    return false;
  }

  /* ── leitura ─────────────────────────────────────────────────────── */

  const isLibraryFile = (parsed) => Boolean(parsed
    && (parsed.format === VAULT_FORMAT || parsed.format === "referencias/backup")
    && Array.isArray(parsed.items));

  async function vaultFileHandle(path) {
    const parts = String(path).split("/").filter(Boolean);
    let dir = vault.dir;
    while (parts.length > 1) dir = await dir.getDirectoryHandle(parts.shift());
    return dir.getFileHandle(parts[0]);
  }

  async function readVaultSnapshot(path = VAULT_FILE) {
    const handle = await vaultFileHandle(path).catch(() => null);
    if (!handle) return null;
    const file = await handle.getFile();
    if (!file.size) return null;

    let parsed;
    try { parsed = JSON.parse(await file.text()); }
    catch { throw new Error(`O ${baseName(path)} dessa pasta está ilegível`); }

    if (!isLibraryFile(parsed)) {
      throw new Error(`Essa pasta já tem um ${baseName(path)} que não é de Referências`);
    }
    return parsed;
  }

  async function readVaultImage(path) {
    try {
      const file = await (await vaultFileHandle(path)).getFile();
      return file.size ? await inMemory(file) : null;
    } catch {
      return null;
    }
  }

  /**
   * Um arquivo lido do disco é só um apontamento pra ele: se o arquivo mudar
   * de nome ou sair da pasta, a imagem quebra na tela e no banco. Copiar os
   * bytes pra memória desliga a referência do arquivo de origem.
   */
  async function inMemory(blob) {
    if (!(blob instanceof File)) return blob;
    const type = blob.type || ({ ".png": "image/png", ".jpg": "image/jpeg", ".jpeg": "image/jpeg",
      ".gif": "image/gif", ".svg": "image/svg+xml" })[extOf(blob.name)] || "image/webp";
    return new Blob([await blob.arrayBuffer()], { type });
  }

  /** Quem é dono de cada imagem, segundo um acervo.json. */
  function indexFromSnapshot(snapshot) {
    const index = new Map();
    for (const row of (snapshot && snapshot.items) || []) {
      if (row && row.id && row.image) index.set(row.id, baseName(row.image));
    }
    for (const [id, path] of Object.entries((snapshot && snapshot.imagensGuardadas) || {})) {
      if (!index.has(id)) index.set(id, baseName(path));
    }
    return index;
  }

  /**
   * Onde procurar a imagem de uma referência, em ordem: o nome que ela tem
   * hoje (o título pode ter mudado desde que a versão foi guardada), o caminho
   * que o arquivo cita — se nenhuma outra referência for dona dele agora — e o
   * nome antigo, que era o id.
   */
  function imageCandidates(raw, index) {
    const paths = [];
    const own = index.get(raw.id);
    if (own) paths.push(VAULT_IMAGES + "/" + own);
    if (raw.image) {
      const name = lower(baseName(raw.image));
      const taken = [...index].some(([id, file]) => id !== raw.id && lower(file) === name);
      if (!taken) paths.push(raw.image);
    }
    for (const ext of IMAGE_EXTS) paths.push(VAULT_IMAGES + "/" + raw.id + ext);
    return paths;
  }

  async function vaultImageFor(raw) {
    if (!vaultOn() || !raw) return null;
    for (const path of imageCandidates(raw, vault.index)) {
      const file = await readVaultImage(path);
      if (file) return file;
    }
    return null;
  }

  function imageRatioOf(blob) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(blob);
      const image = new Image();
      image.onload = () => { URL.revokeObjectURL(url); resolve(image.width / image.height || 1); };
      image.onerror = () => { URL.revokeObjectURL(url); resolve(undefined); };
      image.src = url;
    });
  }

  /**
   * Devolve a imagem a uma referência que estava sem ela. Não conta como
   * edição: o `updatedAt` fica, senão a referência passaria por cima de
   * versões mais novas dela em outro lugar só por ter recuperado a capa.
   */
  async function attachImage(id, blob, { ratio } = {}) {
    const before = state.items.find((item) => item.id === id);
    if (!before) return null;
    const data = await inMemory(blob);
    const measured = ratio || (before.imageRatio ? undefined : await imageRatioOf(data));
    // Relê depois das esperas: o acervo pode ter mudado enquanto a imagem era
    // lida, e a posição antiga já pode ser de outra referência.
    const index = state.items.findIndex((item) => item.id === id);
    if (index === -1) return null;
    const { image, ...rest } = state.items[index];
    const next = Object.assign({}, rest, { imageBlob: data });
    if (!next.imageRatio && measured) next.imageRatio = measured;
    releaseCover(id);
    state.items[index] = next;
    await rawPut(S_ITEMS, next);
    return next;
  }

  /**
   * Traz da pasta o que está lá e não está aqui. Em cada id vence quem tem o
   * `updatedAt` mais novo, então trazer de volta nunca desfaz uma edição
   * recente deste navegador.
   */
  async function mergeFromVault({ force = false, settings = false } = {}) {
    const snapshot = await readVaultSnapshot();
    if (!snapshot) return 0;
    vault.index = indexFromSnapshot(snapshot);

    // Se o arquivo ainda tem o carimbo da nossa última gravação, este
    // navegador já é a versão mais nova: não há o que trazer.
    if (!force && snapshot.savedAt && snapshot.savedAt === vault.stamp) return 0;

    const boardMap = new Map(state.boards.map((board) => [board.id, board]));
    const boardsIn = [];
    for (const board of snapshot.boards || []) {
      if (!board || !board.id) continue;
      const current = boardMap.get(board.id);
      if (current && (current.updatedAt || 0) > (board.updatedAt || 0)) continue;
      boardMap.set(board.id, board);
      boardsIn.push(board);
    }

    const itemMap = new Map(state.items.map((item) => [item.id, item]));
    const itemsIn = [];
    for (const raw of snapshot.items) {
      if (!raw || !raw.id) continue;
      const current = itemMap.get(raw.id);
      const { image, imagePendente, imageData, ...rest } = raw;
      const path = image || imagePendente;
      // Igual ou mais antiga que a daqui não entra — a não ser pra devolver
      // a imagem que falta aqui.
      const newer = !current || (current.updatedAt || 0) < (raw.updatedAt || 0);
      const needsImage = Boolean(current && !current.imageBlob && (path || imageData));
      if (!newer && !needsImage) continue;

      const blob = current && current.imageBlob ? current.imageBlob
        : imageData ? await (await fetch(imageData)).blob()
        : path ? await vaultImageFor(Object.assign({}, raw, { image: path })) : null;

      let item;
      if (newer) {
        item = normalizeImported(rest);
        if (blob) item.imageBlob = blob;
        else if (path) item.image = path;
      } else {
        if (!blob) continue;
        const { image: _pendente, ...mine } = current;
        item = Object.assign({}, mine, { imageBlob: blob });
      }
      itemsIn.push(item);
    }

    // Lido o que havia pra ler, entra no acervo de agora — que pode ter mudado
    // enquanto as imagens eram lidas.
    const applied = mergeIntoState(itemsIn, boardsIn);
    if (!applied.length && !boardsIn.length) return 0;
    if (applied.length) await dropSeedLeftovers(snapshot);

    await rawPutMany(S_BOARDS, boardsIn);
    await rawPutMany(S_ITEMS, applied);

    if (settings && snapshot.settings) {
      state.view = snapshot.settings.view || state.view;
      state.sort = snapshot.settings.sort || state.sort;
      state.theme = snapshot.settings.theme || state.theme;
      applyTheme();
    }

    return applied.length;
  }

  /**
   * Uma referência vinda de arquivo, com os campos que o resto do app supõe
   * que existem. Sem título, a ordenação por título e o painel quebravam.
   */
  function normalizeImported(rest) {
    const fallback = rest.kind === "palette" ? "Paleta" : rest.kind === "image" ? UNNAMED_IMAGE
      : rest.kind === "note" ? "Nota" : hostOf(rest.url) || "Sem título";
    return Object.assign({}, rest, {
      title: String(rest.title || "").trim() || fallback,
      tags: Array.isArray(rest.tags) ? rest.tags : [],
      boardIds: Array.isArray(rest.boardIds) ? rest.boardIds : [],
      favorite: Boolean(rest.favorite),
    });
  }

  /**
   * Põe no acervo o que foi lido de um arquivo, relendo o estado de agora:
   * enquanto as imagens eram lidas, alguém pode ter criado, editado ou
   * apagado uma referência. Em cada id fica a versão editada por último.
   * Devolve as referências que entraram de fato.
   */
  function mergeIntoState(items, boards) {
    const itemMap = new Map(state.items.map((item) => [item.id, item]));
    const applied = items.filter((item) => {
      const current = itemMap.get(item.id);
      return !current || (current.updatedAt || 0) <= (item.updatedAt || 0);
    });
    applied.forEach((item) => { releaseCover(item.id); itemMap.set(item.id, item); });
    const boardMap = new Map(state.boards.map((board) => [board.id, board]));
    boards.forEach((board) => boardMap.set(board.id, board));
    state.items = [...itemMap.values()];
    state.boards = [...boardMap.values()];
    sortBoards();
    return applied;
  }

  /**
   * O acervo de exemplo existe só pra página não abrir vazia. Quando a pasta
   * devolve um acervo de verdade — o caso de quem perdeu o navegador e está
   * recuperando — ele sai de cena em vez de se misturar ao que é seu. Só sai o
   * que nunca foi tocado: exemplo editado ou organizado é conteúdo seu.
   */
  async function dropSeedLeftovers(snapshot) {
    const inVault = new Set((snapshot.items || []).map((item) => item && item.id));
    const stale = state.items.filter((item) =>
      String(item.id).startsWith("seed-") && !inVault.has(item.id) && item.createdAt === item.updatedAt);
    if (!stale.length) return;

    const ids = new Set(stale.map((item) => item.id));
    state.items = state.items.filter((item) => !ids.has(item.id));
    stale.forEach((item) => releaseCover(item.id));
    for (const id of ids) await rawDelete(S_ITEMS, id);

    const vaultBoards = new Set((snapshot.boards || []).map((board) => board && board.id));
    const emptyBoards = state.boards.filter((board) =>
      String(board.id).startsWith("seed-board-") && !vaultBoards.has(board.id) &&
      !state.items.some((item) => item.boardIds.includes(board.id)));
    if (!emptyBoards.length) return;

    const boardIds = new Set(emptyBoards.map((board) => board.id));
    state.boards = state.boards.filter((board) => !boardIds.has(board.id));
    for (const id of boardIds) await rawDelete(S_BOARDS, id);
    if (state.selection.type === "board" && boardIds.has(state.selection.id)) {
      state.selection = { type: "todos" };
    }
  }

  /* ── versões guardadas ───────────────────────────────────────────── */

  /**
   * Antes da primeira gravação de um dia novo, a versão com que o acervo
   * fechou o último dia de uso vai pra historico/. Confere uma vez por dia por
   * sessão; se a versão daquele dia já está lá, nada muda.
   */
  async function rotateHistory() {
    const today = localDay(Date.now());
    if (vault.historyDay === today) return;

    const handle = await vault.dir.getFileHandle(VAULT_FILE).catch(() => null);
    const file = handle && await handle.getFile();
    if (file && file.size) {
      const text = await file.text();
      let parsed = null;
      try { parsed = JSON.parse(text); } catch { /* arquivo ilegível não vira versão */ }
      const day = parsed && localDay(Date.parse(parsed.savedAt) || file.lastModified);
      if (isLibraryFile(parsed) && parsed.items.length && day !== today) {
        const history = await vault.dir.getDirectoryHandle(VAULT_HISTORY, { create: true });
        const name = "acervo-" + day + ".json";
        const exists = await history.getFileHandle(name).then(() => true, () => false);
        if (!exists) {
          await writeVaultFile(history, name, text);
          await pruneHistory(history);
          vault.kept = null;
        }
      }
    }
    vault.historyDay = today;
  }

  /** Guarda em historico/ o acervo.json de agora, com um rótulo. */
  async function saveHistoryNow(label) {
    if (!vaultOn() || !(await ensureVaultAccess())) return null;
    const handle = await vault.dir.getFileHandle(VAULT_FILE).catch(() => null);
    const file = handle && await handle.getFile();
    if (!file || !file.size) return null;

    const now = new Date();
    const name = "acervo-" + localDay(now) + "-" + String(now.getHours()).padStart(2, "0")
      + String(now.getMinutes()).padStart(2, "0") + (label ? "-" + label : "") + ".json";
    const history = await vault.dir.getDirectoryHandle(VAULT_HISTORY, { create: true });
    await writeVaultFile(history, name, await file.text());
    await pruneHistory(history);
    vault.kept = null;
    return VAULT_HISTORY + "/" + name;
  }

  async function pruneHistory(history) {
    const names = [];
    for await (const entry of history.values()) {
      if (entry.kind === "file" && /^acervo-.*\.json$/i.test(entry.name)) names.push(entry.name);
    }
    names.sort().reverse();
    for (const name of names.slice(HISTORY_KEEP)) await history.removeEntry(name).catch(() => {});
  }

  /**
   * Lê as versões guardadas — a cópia manual e o histórico — e anota quais
   * referências elas citam. As imagens dessas referências ficam na pasta mesmo
   * depois de apagadas do acervo: restaurar sem as capas seria restaurar pela
   * metade.
   */
  async function loadKept() {
    if (vault.kept) return vault.kept;
    const kept = new Map();
    const versions = [];

    const take = (path, manual, snapshot) => {
      if (!snapshot || !snapshot.items.length) return;
      versions.push({
        path, manual,
        items: snapshot.items.length,
        boards: (snapshot.boards || []).length,
        savedAt: snapshot.savedAt || snapshot.exportedAt || "",
      });
      for (const row of snapshot.items) {
        if (!row || !row.id || kept.has(row.id)) continue;
        if (row.image || row.kind === "image") {
          kept.set(row.id, { title: row.title, image: row.image ? baseName(row.image) : "", createdAt: row.createdAt });
        }
      }
    };

    const rescue = await readVaultSnapshot(VAULT_RESCUE).catch(() => null);
    take(VAULT_RESCUE, true, rescue);
    vault.rescue = rescue && rescue.items.length
      ? { items: rescue.items.length, boards: (rescue.boards || []).length, savedAt: rescue.savedAt || "" }
      : null;

    const history = await vault.dir.getDirectoryHandle(VAULT_HISTORY).catch(() => null);
    if (history) {
      const names = [];
      for await (const entry of history.values()) {
        if (entry.kind === "file" && /\.json$/i.test(entry.name)) names.push(entry.name);
      }
      names.sort().reverse();
      for (const name of names) {
        const path = VAULT_HISTORY + "/" + name;
        take(path, false, await readVaultSnapshot(path).catch(() => null));
      }
    }

    vault.kept = kept;
    vault.versions = versions;
    return kept;
  }

  /* ── gravação ────────────────────────────────────────────────────── */

  let vaultTimer = null;
  let vaultWriting = false;
  let vaultDirty = false;
  /** Falhas seguidas — pasta removida, disco cheio, permissão revogada. */
  let vaultFailures = 0;

  /**
   * Chamada por toda escrita no banco local. O atraso junta a rajada de
   * alterações de uma ação só (colar 20 links) numa gravação só.
   */
  function scheduleVaultSave(delay = 900) {
    if (!vaultOn()) return;
    vaultDirty = true;
    clearTimeout(vaultTimer);
    vaultTimer = setTimeout(() => { void writeVault(); }, delay);
  }

  /** Espera a gravação em curso terminar (até ~10 s). */
  async function waitVaultIdle() {
    for (let i = 0; vaultWriting && i < 200; i++) await new Promise((resolve) => setTimeout(resolve, 50));
    return !vaultWriting;
  }

  /** Grava agora, esperando a gravação em curso terminar em vez de pular. */
  async function flushVault(options) {
    if (!(await waitVaultIdle())) return false;
    return writeVault(options);
  }

  /**
   * Grava o acervo na pasta. Devolve `true` só quando acervo.json (e a cópia
   * manual, se pedida) foram gravados de fato — quem depende disso, como
   * "Limpar acervo", não segue em frente sem essa confirmação.
   */
  async function writeVault({ checkpoint = false } = {}) {
    if (!vaultOn() || vaultWriting) return false;
    clearTimeout(vaultTimer);
    vaultWriting = true;
    vaultDirty = false;
    setVaultStatus("saving");
    // A pasta desta gravação. Se ela for trocada no meio, nada vai pro lugar errado.
    const dir = vault.dir;

    try {
      if (!(await ensureVaultAccess())) return false;

      await rotateHistory();
      const kept = await loadKept();

      const imagesDir = await dir.getDirectoryHandle(VAULT_IMAGES, { create: true });
      const onDisk = new Map();
      for await (const entry of imagesDir.values()) {
        if (entry.kind === "file") onDisk.set(lower(entry.name), entry);
      }
      const exists = (name) => Boolean(name) && onDisk.has(lower(name));

      // De quem é cada arquivo. Pastas gravadas antes do índice nomeavam a
      // imagem pelo id da referência: é assim que elas entram nele.
      const index = new Map([...vault.index].filter(([, name]) => exists(name)));
      const owner = () => new Map([...index].map(([id, name]) => [lower(name), id]));
      const known = new Set([...state.items.map((item) => item.id), ...kept.keys()]);
      for (const entry of onDisk.values()) {
        const id = stemOf(entry.name);
        if (known.has(id) && !index.has(id)) index.set(id, entry.name);
      }
      let owners = owner();
      for (const [id, info] of kept) {
        if (index.has(id) || !exists(info.image) || owners.has(lower(info.image))) continue;
        index.set(id, onDisk.get(lower(info.image)).name);
        owners = owner();
      }

      // Referência sem imagem cujo arquivo está aqui — o import de um JSON
      // sozinho, um navegador que perdeu a capa — volta inteira.
      let healed = 0;
      for (const item of state.items.slice()) {
        if (item.imageBlob) continue;
        let name = index.get(item.id);
        const pending = item.image && baseName(item.image);
        if (!name && pending && exists(pending) && !owners.has(lower(pending))) {
          name = onDisk.get(lower(pending)).name;
          index.set(item.id, name);
          owners = owner();
        }
        if (!name) continue;
        await attachImage(item.id, await onDisk.get(lower(name)).getFile());
        healed += 1;
      }

      // O nome de cada arquivo é o título da referência — o nome que você deu.
      const items = state.items.slice();
      const entries = [];
      for (const item of items) {
        if (!item.imageBlob) continue;
        entries.push({ id: item.id, title: item.title, ext: imageExt(item.imageBlob),
          current: index.get(item.id), createdAt: item.createdAt, item });
      }
      const live = new Set(entries.map((entry) => entry.id));
      for (const [id, info] of kept) {
        if (live.has(id) || !index.has(id)) continue;
        const current = index.get(id);
        entries.push({ id, title: info.title, ext: extOf(current) || ".webp", current, createdAt: info.createdAt });
      }
      // O nome que uma referência ainda sem imagem espera fica reservado pra
      // ela: se o arquivo aparecer depois, ele é dela, não de outra.
      const pendingNames = new Set(items.filter((item) => !item.imageBlob && item.image)
        .map((item) => lower(baseName(item.image))));
      const names = assignImageNames(entries, onDisk, owners, pendingNames);

      const renamed = new Set();
      for (const entry of entries) {
        const name = names.get(entry.id);
        const same = entry.current && lower(entry.current) === lower(name);
        if (same && exists(name)) continue;
        if (entry.item) {
          await writeVaultFile(imagesDir, name, entry.item.imageBlob);
        } else {
          // Imagem que só uma versão guardada cita: muda de nome pela própria pasta.
          await writeVaultFile(imagesDir, name, await onDisk.get(lower(entry.current)).getFile());
        }
        if (entry.current && !same) renamed.add(lower(entry.current));
      }

      const rows = [];
      for (const item of items) {
        const { imageBlob, image, ...rest } = item;
        if (imageBlob && names.has(item.id)) rows.push(Object.assign({}, rest, { image: VAULT_IMAGES + "/" + names.get(item.id) }));
        // Imagem ainda não encontrada: o caminho fica anotado pra ela poder
        // voltar — num campo à parte, pra ninguém ler como dona do arquivo.
        else if (image) rows.push(Object.assign({}, rest, { imagePendente: image }));
        else rows.push(rest);
      }
      const guardadas = {};
      for (const entry of entries) {
        if (!entry.item) guardadas[entry.id] = VAULT_IMAGES + "/" + names.get(entry.id);
      }

      const stamp = new Date().toISOString();
      const snapshot = {
        format: VAULT_FORMAT,
        version: 1,
        savedAt: stamp,
        settings: { view: state.view, sort: state.sort, theme: state.theme },
        boards: state.boards,
        items: rows,
      };
      // Imagens de referências apagadas que alguma versão guardada ainda cita.
      if (Object.keys(guardadas).length) snapshot.imagensGuardadas = guardadas;
      if (vault.dir !== dir) { vaultDirty = true; return false; }
      await writeVaultFile(dir, VAULT_FILE, JSON.stringify(snapshot, null, 2));
      vault.index = new Map(names);
      document.querySelectorAll("[data-image-file]").forEach((node) => {
        const name = vault.index.get(node.dataset.imageFile);
        if (name) node.textContent = VAULT_IMAGES + "/" + name;
      });

      // A cópia manual: o mesmo conteúdo, num arquivo que nada automático encosta.
      if (checkpoint) {
        await writeVaultFile(dir, VAULT_RESCUE, JSON.stringify(snapshot, null, 2));
        vault.rescue = { items: rows.length, boards: state.boards.length, savedAt: stamp };
        vault.kept = null;
      }

      // Só depois de o acervo.json novo estar gravado sai da pasta o que é do
      // app e ninguém mais cita: arquivo com dono no índice, nome antigo de um
      // renomeado ou nome de id (o app gera ids em minúsculas). Assim um
      // travamento no meio nunca deixa o acervo.json citando arquivo apagado.
      // O que alguém pôs na pasta à mão fica onde está.
      const keepNames = new Set([...names.values(), ...pendingNames].map(lower));
      for (const [name, entry] of onDisk) {
        if (keepNames.has(name)) continue;
        const stem = stemOf(entry.name);
        const idName = (UUID_RE.test(stem) && stem === stem.toLowerCase()) || stem.startsWith("seed-");
        if (owners.has(name) || renamed.has(name) || idName) await imagesDir.removeEntry(entry.name).catch(() => {});
      }

      vault.stamp = stamp;
      vault.savedAt = Date.now();
      vault.error = "";
      vaultFailures = 0;
      await rememberVault();
      setVaultStatus("ready");

      if (healed) {
        renderGrid();
        if (state.detailId) renderDetail();
        toast(contar(healed, "imagem voltou", "imagens voltaram") + " da pasta para as referências", { tone: "success" });
      }
      return true;
    } catch (error) {
      console.error("Falha ao gravar a pasta do acervo", error);
      vault.error = (error && error.message) || String(error);
      vaultFailures += 1;
      // O que falhou continua só no navegador: tenta de novo sozinho, mas
