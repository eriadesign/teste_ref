      // desiste depois de algumas vezes em vez de insistir pra sempre.
      if (vaultFailures <= 3) vaultDirty = true;
      setVaultStatus("error");
      return false;
    } finally {
      vaultWriting = false;
      if (vaultDirty) scheduleVaultSave(vaultFailures > 0 ? vaultFailures * 5000 : 400);
    }
  }

  /**
   * Escreve no acervo o que veio de um arquivo — do import, da pasta ou de
   * uma versão guardada. Soma ao que já existe e, em cada id, vence a versão
   * editada por último; trazer duas vezes não duplica nada. Uma referência
   * daqui que esteja sem imagem ganha a do arquivo, mesmo sendo mais nova.
   *
   * `resolveImage(raw)` acha a imagem de uma referência que não a traz
   * embutida — na pasta conectada, por padrão.
   */
  async function applyImport(parsed, { resolveImage = vaultImageFor } = {}) {
    const boardMap = new Map(state.boards.map((b) => [b.id, b]));
    const boards = (parsed.boards || []).filter((b) => b && b.id && b.name
      && (!boardMap.has(b.id) || (boardMap.get(b.id).updatedAt || 0) <= (b.updatedAt || 0)));

    const itemMap = new Map(state.items.map((i) => [i.id, i]));
    const items = [];
    let semImagem = 0;

    for (const raw of parsed.items || []) {
      if (!raw || !raw.id) continue;
      const { imageData, image, imagePendente, ...rest } = raw;
      const path = image || imagePendente;
      const current = itemMap.get(raw.id);
      const hasImage = Boolean(imageData || path);
      const lacking = hasImage && !(current && current.imageBlob);

      let blob = null;
      if (lacking) {
        blob = imageData ? await (await fetch(imageData)).blob()
          : await resolveImage(Object.assign({}, raw, { image: path }));
        if (blob) blob = await inMemory(blob);
      }

      if (current && (current.updatedAt || 0) >= (raw.updatedAt || 0)) {
        // A daqui é a mesma ou foi editada depois: fica como está, só ganha a
        // imagem se faltava. Igual não conta como importada.
        if (blob) {
          const { image: _pendente, ...mine } = current;
          items.push(Object.assign({}, mine, { imageBlob: blob,
            imageRatio: mine.imageRatio || raw.imageRatio || await imageRatioOf(blob) }));
        } else if (lacking) semImagem++;
        continue;
      }

      const item = normalizeImported(rest);
      const imageBlob = blob || (current && current.imageBlob);
      if (imageBlob) {
        item.imageBlob = imageBlob;
        if (!item.imageRatio) item.imageRatio = await imageRatioOf(imageBlob);
      } else if (hasImage) {
        // Fica anotado de onde a imagem viria: a pasta, quando aparecer, completa.
        if (path) item.image = path;
        semImagem++;
      }
      items.push(item);
    }

    const applied = mergeIntoState(items, boards);
    if (applied.length || boards.length) {
      await dbPutMany(S_BOARDS, boards);
      await dbPutMany(S_ITEMS, applied);
      // Chegou um acervo de verdade: os exemplos que você nunca tocou saem.
      if (applied.length) await dropSeedLeftovers(parsed);
      state.selection = { type: "todos" };
      renderRail(); renderHead(); renderGrid();
    }

    return { items: applied.length, boards: boards.length, semImagem };
  }

  const contar = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;

  /** A cópia salva, inteira. `null` quando não existe ou está vazia. */
  async function readRescue() {
    if (!vaultOn()) return null;
    try {
      const snapshot = await readVaultSnapshot(VAULT_RESCUE);
      if (!snapshot || !snapshot.items.length) return null;
      vault.rescue = {
        items: snapshot.items.length,
        boards: (snapshot.boards || []).length,
        savedAt: snapshot.savedAt || "",
      };
      return snapshot;
    } catch {
      return null;
    }
  }

  /**
   * `createWritable` grava num arquivo temporário e só troca pelo original no
   * `close`: um travamento no meio da gravação não deixa acervo.json pela
   * metade — ou é a versão nova inteira, ou continua a anterior.
   */
  async function writeVaultFile(dir, name, data) {
    const handle = await dir.getFileHandle(name, { create: true });
    const writable = await handle.createWritable();
    try {
      await writable.write(data);
    } catch (error) {
      await writable.abort().catch(() => {});
      throw error;
    }
    await writable.close();
  }

  async function rememberVault() {
    try { await rawPut(S_PREFS, { dir: vault.dir, stamp: vault.stamp }, VAULT_KEY); }
    catch (error) { console.warn("Não consegui lembrar a pasta escolhida", error); }
  }

  /* ── ligar, religar, desligar ────────────────────────────────────── */

  async function pickVault() {
    if (!vaultSupported()) return;
    let dir;
    try {
      dir = await window.showDirectoryPicker({ id: "referencias-acervo", mode: "readwrite", startIn: "documents" });
    } catch (error) {
      if (error && error.name === "AbortError") return;
      toast("Não consegui abrir o seletor de pastas", { tone: "error" });
      return;
    }
    await useVaultDir(dir);
  }

  async function useVaultDir(dir) {
    // Uma gravação em curso termina na pasta antiga antes da troca.
    await waitVaultIdle();
    const previous = {
      dir: vault.dir, name: vault.name, stamp: vault.stamp,
      index: vault.index, kept: vault.kept, versions: vault.versions, historyDay: vault.historyDay, rescue: vault.rescue,
    };
    vault.dir = dir;
    vault.name = dir.name || "acervo";
    vault.stamp = "";
    vault.error = "";
    resetVaultMemory();
    setVaultStatus("saving");

    let restored = 0;
    try {
      if (!(await ensureVaultAccess(true))) return;
      restored = await mergeFromVault({ force: true, settings: !state.items.length });
    } catch (error) {
      // Pasta com um acervo.json que não sabemos ler: sair sem tocar em nada é
      // melhor do que sobrescrever o arquivo de outra pessoa.
      Object.assign(vault, previous);
      setVaultStatus(vault.dir ? "ready" : "off");
      toast((error && error.message) || "Não consegui ler essa pasta", { tone: "error" });
      return;
    }

    await rememberVault();
    await writeVault();
    if (restored) { renderRail(); renderHead(); renderGrid(); }
    toast(restored
      ? `${restored} ${restored === 1 ? "referência recuperada" : "referências recuperadas"} da pasta`
      : `Acervo salvo em ${vault.name}/ a cada alteração`, { tone: "success" });
    void tidyLibrary();
  }

  async function reconnectVault() {
    if (!vaultOn()) return pickVault();
    if (!(await ensureVaultAccess(true))) {
      toast("Sem permissão, a pasta segue desconectada", { tone: "error" });
      return;
    }
    try {
      const restored = await mergeFromVault({ force: true });
      if (restored) { renderRail(); renderHead(); renderGrid(); }
    } catch (error) {
      toast((error && error.message) || "Não consegui ler a pasta", { tone: "error" });
      return;
    }
    await writeVault();
    toast(`Salvando em ${vault.name}/ de novo`, { tone: "success" });
  }

  /** Traz de volta uma versão guardada na pasta — o desfazer de uma limpeza. */
  async function restoreVersion(path) {
    let snapshot = null;
    try { snapshot = vaultOn() ? await readVaultSnapshot(path) : null; } catch { /* tratado abaixo */ }
    if (!snapshot || !snapshot.items.length) {
      toast("Essa versão não está mais na pasta", { tone: "error" });
      return;
    }
    const { items, boards, semImagem } = await applyImport(snapshot);
    toast("Restaurei " + contar(items, "referência", "referências")
      + (boards ? " e " + contar(boards, "board", "boards") : "")
      + (semImagem ? ` — ${contar(semImagem, "ficou sem a imagem", "ficaram sem a imagem")}` : ""),
      { tone: semImagem ? "info" : "success" });
  }

  const restoreRescue = () => restoreVersion(VAULT_RESCUE);

  async function forgetVault() {
    await waitVaultIdle();
    vault.dir = null;
    vault.name = "";
    vault.stamp = "";
    vault.error = "";
    resetVaultMemory();
    setVaultStatus("off");
    try { await rawDelete(S_PREFS, VAULT_KEY); } catch (error) { /* nada a fazer */ }
    toast("Parei de salvar na pasta — o que já está lá continua lá");
  }

  /** Retoma a pasta da sessão anterior. Roda no arranque, antes do primeiro render. */
  async function restoreVault({ settings } = {}) {
    if (!vaultSupported()) return;

    let record = null;
    try { record = await dbGet(S_PREFS, VAULT_KEY); } catch (error) { /* banco indisponível */ }
    if (!record || !record.dir) return;

    vault.dir = record.dir;
    vault.name = record.dir.name || "acervo";
    vault.stamp = record.stamp || "";

    if (!(await ensureVaultAccess())) {
      // O Chrome esquece a permissão a cada reabertura, a não ser que você
      // marque "permitir sempre". Um clique resolve — e até lá nada é gravado.
      toast("Reconecte a pasta do acervo pra voltar a salvar em disco", {
        action: { label: "Reconectar", run: () => { void reconnectVault(); } },
      });
      return;
    }

    try {
      await mergeFromVault({ settings });
      setVaultStatus("ready");
    } catch (error) {
      console.error("Falha ao ler a pasta do acervo", error);
      vault.error = (error && error.message) || String(error);
      setVaultStatus("error");
      // A próxima gravação vai substituir esse acervo.json que não deu pra
      // ler (meio sincronizado, de outro app…). Antes, uma cópia dele vai
      // pro histórico, do jeito que está.
      await preserveUnreadable().catch(() => {});
      return;
    }
    scheduleVaultSave(600);
  }

  async function preserveUnreadable() {
    const handle = await vault.dir.getFileHandle(VAULT_FILE).catch(() => null);
    const file = handle && await handle.getFile();
    if (!file || !file.size) return;
    const history = await vault.dir.getDirectoryHandle(VAULT_HISTORY, { create: true });
    const stamp = new Date().toISOString().replace(/[:.]/g, "-");
    await writeVaultFile(history, "acervo-ilegivel-" + stamp + ".json", await file.text());
  }

  /* ── importar uma pasta e completar imagens ──────────────────────── */

  /** O caminho do arquivo dentro da pasta escolhida, sem o nome dela. */
  function relPath(file) {
    const full = file.webkitRelativePath || file.name || "";
    const parts = full.split("/").filter(Boolean);
    return parts.length > 1 ? parts.slice(1).join("/") : parts.join("/");
  }

  /** Abre o seletor de pasta do sistema — funciona em qualquer navegador. */
  function pickFolder() {
    const input = el("input", { type: "file", multiple: true, webkitdirectory: true, hidden: true });
    input.addEventListener("change", () => {
      const files = [...(input.files || [])];
      input.remove();
      void importFolder(files);
    });
    document.body.append(input);
    input.click();
  }

  function versionTitle(path, savedAt) {
    const when = Date.parse(savedAt);
    const date = Number.isFinite(when) ? formatDate(when) : "";
    const name = baseName(path);
    if (name === VAULT_FILE) return "O acervo mais recente" + (date ? ", de " + date : "");
    if (name === VAULT_RESCUE) return "A cópia salva por você" + (date ? ", de " + date : "");
    if (/antes-de-limpar/.test(name)) return "Antes de limpar o acervo" + (date ? ", em " + date : "");
    const day = /acervo-(\d{4})-(\d{2})-(\d{2})/.exec(name);
    if (day) return "Como estava no fim de " + formatDate(new Date(+day[1], +day[2] - 1, +day[3]).getTime());
    return name;
  }

  /** Pergunta qual versão importar quando a pasta tem mais de uma. */
  function chooseVersion(candidates) {
    return new Promise((resolve) => {
      let dismiss = null;
      const list = el("div", { class: "versions" }, candidates.map((candidate) =>
        el("button", { class: "version version-choice", onclick: () => { dismiss(); resolve(candidate); } }, [
          el("div", { style: "flex:1;min-width:0" }, [
            el("b", { text: versionTitle(candidate.rel, candidate.parsed.savedAt || candidate.parsed.exportedAt) }),
            el("span", { text: candidate.rel + " · "
              + contar(candidate.parsed.items.length, "referência", "referências")
              + ((candidate.parsed.boards || []).length ? " · " + contar(candidate.parsed.boards.length, "board", "boards") : "") }),
          ]),
          svg(ICON.chevron, 14),
        ])));
      dismiss = modal({
        title: "Qual versão importar?",
        description: "A pasta tem mais de uma versão do acervo. As imagens vêm junto de qualquer uma delas.",
        body: [list, el("p", { class: "fine", text: "O import soma ao acervo de agora: o que já existe aqui e é mais novo continua como está." })],
        footer: [el("button", { class: "btn btn-ghost", text: "Cancelar", onclick: () => { dismiss(); resolve(null); } })],
      });
    });
  }

  /**
   * Importa uma pasta do acervo inteira — acervo.json e as imagens ao lado —
   * pelo seletor de pastas comum, sem precisar conectá-la. Escolhida só a
   * pasta imagens/ (ou uma sem acervo dentro), completa as referências que
   * estão sem capa.
   */
  async function importFolder(files) {
    if (!files.length) return;
    const byPath = new Map(files.map((file) => [lower(relPath(file)), file]));

    // Vale tanto a pasta do acervo quanto a de cima dela: o que conta é o nome
    // do arquivo (acervo.json, acervo-anterior.json) ou estar em historico/.
    const candidates = [];
    for (const [rel, file] of byPath) {
      if (!rel.endsWith(".json")) continue;
      const parts = rel.split("/");
      const name = parts[parts.length - 1];
      const parent = parts.length > 1 ? parts[parts.length - 2] : "";
      if (parts.length > 1 && name !== VAULT_FILE && name !== VAULT_RESCUE && parent !== VAULT_HISTORY) continue;
      try {
        const parsed = JSON.parse(await file.text());
        if (isLibraryFile(parsed) && parsed.items.length) candidates.push({ rel: relPath(file), parsed });
      } catch { /* json que não é acervo fica de fora */ }
    }

    if (!candidates.length) {
      const images = files.filter((file) => /^image\//.test(file.type));
      const { matched, already } = await completeFromFiles(images);
      if (matched) {
        renderGrid();
        toast(contar(matched, "imagem voltou", "imagens voltaram") + " para a referência de origem", { tone: "success" });
      } else {
        toast(already
          ? "Essas imagens já estão no acervo"
          : "Nessa pasta não há acervo.json nem imagens de referências que estejam sem capa", { tone: already ? "info" : "error" });
      }
      return;
    }

    const rank = (rel) => {
      const name = lower(baseName(rel));
      return name === VAULT_FILE ? 0 : name === VAULT_RESCUE ? 1 : lower(rel).includes(VAULT_HISTORY + "/") ? 2 : 3;
    };
    candidates.sort((a, b) => rank(a.rel) - rank(b.rel) || (b.rel > a.rel ? 1 : b.rel < a.rel ? -1 : 0));
    const chosen = candidates.length === 1 ? candidates[0] : await chooseVersion(candidates);
    if (!chosen) return;

    // Quem é dono de cada imagem hoje está no acervo.json; a versão escolhida
    // pode citar nomes antigos, de antes de um título mudar.
    const live = candidates.find((candidate) => lower(baseName(candidate.rel)) === VAULT_FILE);
    const index = new Map([...indexFromSnapshot(chosen.parsed), ...(live ? indexFromSnapshot(live.parsed) : [])]);
    // Pelo caminho primeiro; pelo nome do arquivo quando a pasta escolhida
    // não é a raiz do acervo (alguém escolheu a de cima, por exemplo).
    const byName = new Map();
    for (const file of files) {
      if (/^image\//.test(file.type) && !byName.has(lower(file.name))) byName.set(lower(file.name), file);
    }
    const resolveImage = async (raw) => {
      const paths = imageCandidates(raw, index);
      for (const path of paths) {
        const file = byPath.get(lower(path));
        if (file) return file;
      }
      for (const path of paths) {
        const file = byName.get(lower(baseName(path)));
        if (file) return file;
      }
      return null;
    };

    reportImport(await applyImport(chosen.parsed, { resolveImage }));
    void tidyLibrary();
  }

  function reportImport({ items, boards, semImagem }) {
    const resumo = "Importei " + contar(items, "referência", "referências")
      + (boards ? " e " + contar(boards, "board", "boards") : "");
    if (semImagem) {
      toast(`${resumo} — ${contar(semImagem, "ficou sem a imagem", "ficaram sem a imagem")}`, {
        action: { label: "Escolher a pasta", run: pickFolder },
      });
    } else {
      toast(resumo, { tone: "success" });
    }
  }

  /**
   * Imagens que já são de alguma referência — as de imagens/, arrastadas ou
   * escolhidas de volta — completam a referência em vez de virar outra. O
   * casamento é pelo nome do arquivo: o caminho que a referência anotou, o
   * nome dela na pasta ou o id, que era o nome antigo. Devolve as que não são
   * de ninguém, pra seguirem como imagens novas.
   */
  async function completeFromFiles(files) {
    // Nome que serve a mais de uma referência sem imagem é ambíguo: a imagem
    // entra como nova em vez de cair na referência errada.
    const missing = new Map();
    const claim = (key, item) => {
      const other = missing.get(key);
      missing.set(key, other && other !== item ? null : item);
    };
    const present = new Set();
    for (const item of state.items) {
      if (item.imageBlob) {
        // Já tem imagem: o arquivo dela na pasta (pelo id antigo ou pelo
        // título) arrastado de volta não vira uma cópia.
        present.add(lower(item.id));
        if (vault.index.has(item.id)) present.add(lower(vault.index.get(item.id)));
        continue;
      }
      claim(lower(item.id), item);
      if (item.image) claim(lower(baseName(item.image)), item);
      if (vault.index.has(item.id)) claim(lower(vault.index.get(item.id)), item);
    }

    let matched = 0, already = 0;
    const rest = [];
    for (const file of files) {
      const name = lower(file.name);
      const item = missing.get(name) || missing.get(stemOf(name));
      if (present.has(name) || present.has(stemOf(name))) {
        already++;
      } else if (item && !item.imageBlob) {
        await attachImage(item.id, file);
        item.imageBlob = file;
        matched++;
      } else {
        rest.push(file);
      }
    }
    if (matched) scheduleVaultSave();
    return { matched, already, rest };
  }

  /**
   * Arruma o que versões antigas deixaram pra trás. Roda na abertura e depois
   * de cada import; quando não há nada a arrumar, não faz nada.
   *
   * - Imagens da pasta arrastadas de volta viravam uma referência nova, com o
   *   id da original no título, em vez de completar a original sem capa.
   * - Títulos de máquina — o hash do Pinterest, o "image" de um print — viram
   *   "Imagem sem nome": o título é o nome do arquivo na pasta, e um hash não
   *   diz o que a imagem é.
   * - Paletas com o nome automático antigo ("Paleta laranja · 3 cores")
   *   ganham um nome próprio, pra duas paletas laranjas não se chamarem igual.
   */
  async function tidyLibrary() {
    const byId = new Map(state.items.map((item) => [item.id, item]));
    const drop = new Set();
    let joined = 0, renamed = 0;

    for (const copy of state.items.slice()) {
      if (copy.kind !== "image" || !copy.imageBlob) continue;
      const ref = String(copy.title || "").trim().toLowerCase().replace(/[\s_]+/g, "-");
      if (!UUID_RE.test(ref) || ref === lower(copy.id)) continue;
      const original = byId.get(ref) || state.items.find((item) => lower(item.id) === ref);
      if (!original || drop.has(original.id)) continue;

      if (!original.imageBlob) {
        await attachImage(original.id, copy.imageBlob, { ratio: copy.imageRatio });
      } else if (copy.createdAt !== copy.updatedAt) {
        continue; // a original já tem imagem e a cópia você editou: ela é sua, fica
      }
      // O que você fez na cópia vai junto pra original: boards, tags,
      // anotações e favorito.
      const fresh = state.items.find((item) => item.id === original.id) || original;
      const patch = {};
      const boardIds = [...new Set([...(fresh.boardIds || []), ...(copy.boardIds || [])])];
      if (boardIds.length !== (fresh.boardIds || []).length) patch.boardIds = boardIds;
      const tags = [...new Set([...(fresh.tags || []), ...(copy.tags || [])])];
      if (tags.length !== (fresh.tags || []).length) patch.tags = tags;
      if (copy.notes && copy.notes !== fresh.notes) {
        patch.notes = fresh.notes ? fresh.notes + "\n\n" + copy.notes : copy.notes;
      }
      if (copy.favorite && !fresh.favorite) patch.favorite = true;
      if (Object.keys(patch).length) await updateItem(original.id, patch);
      drop.add(copy.id);
      joined++;
    }
    for (const id of drop) await deleteItem(id);

    for (const item of state.items.slice()) {
      if (item.kind === "image" && isMachineName(item.title) && item.title !== UNNAMED_IMAGE) {
        await updateItem(item.id, { title: UNNAMED_IMAGE });
        renamed++;
      }
    }

    const taken = new Set(state.items.map((item) => lower(item.title)));
    let palettes = 0;
    for (const item of state.items.slice()) {
      if (item.kind !== "palette" || !OLD_PALETTE_TITLE.test(String(item.title || "").trim())) continue;
      const title = paletteTitle(item.colors || [], taken);
      taken.add(lower(title));
      await updateItem(item.id, { title });
      palettes++;
    }

    if (!joined && !renamed && !palettes) return;
    renderRail(); renderHead(); renderGrid();
    const parts = [];
    if (joined) parts.push(contar(joined, "imagem em dobro voltou", "imagens em dobro voltaram") + " para a referência de origem");
    if (renamed) parts.push(contar(renamed, "título de código virou", "títulos de código viraram") + ` “${UNNAMED_IMAGE}”`);
    if (palettes) parts.push(contar(palettes, "paleta ganhou nome próprio", "paletas ganharam nome próprio"));
    toast("Arrumei o acervo: " + parts.join(" · "), { tone: "success", duration: 9000 });

   * É a segunda linha de defesa: ajuda, mas não substitui a pasta — limpar os
   * dados do site continua apagando tudo que só existe aqui.

  async function requestPersistence() {
    try {
      if (!navigator.storage || !navigator.storage.persist) return false;
      vault.persisted = await navigator.storage.persisted();
      if (!vault.persisted) vault.persisted = await navigator.storage.persist();
      return vault.persisted;
    } catch {
      return false;
    }

  function paintStudy({ stops, angle }) {
    const canvas = document.createElement("canvas");
    canvas.width = 900; canvas.height = 620;
    const ctx = canvas.getContext("2d");
    const radians = (angle * Math.PI) / 180;
    const gradient = ctx.createLinearGradient(
      0, 0, Math.cos(radians) * canvas.width, Math.sin(radians) * canvas.height,
    );
    stops.forEach((color, i) => gradient.addColorStop(i / (stops.length - 1), color));
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // manchas suaves por cima, pra não ficar um degradê chapado
    for (let i = 0; i < 5; i++) {
      const x = (i * 197) % canvas.width, y = (i * 139) % canvas.height;
      const radius = 150 + i * 60;
      const blob = ctx.createRadialGradient(x, y, 0, x, y, radius);
      blob.addColorStop(0, stops[(i + 1) % stops.length] + "44");
      blob.addColorStop(1, "transparent");
      ctx.fillStyle = blob;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    return new Promise((resolve) => canvas.toBlob(resolve, "image/webp", 0.86));
  }

  async function buildSeed() {

        favorite: i < 2, createdAt, updatedAt: createdAt,

    SEED_NOTES.forEach((note, i) => {

        boardIds: [boards[note.board].id], tags: note.tags,

  function selectionKey(sel) {
    return sel.type === "board" ? "board:" + sel.id
      : sel.type === "tag" ? "tag:" + sel.name : sel.type;
  }

  function visibleItems() {
    let result = state.items;
    const sel = state.selection;

    if (sel.type === "favoritos") result = result.filter((i) => i.favorite);
    else if (sel.type === "recentes") {
      result = result.filter((i) => i.openedAt)
        .sort((a, b) => (b.openedAt || 0) - (a.openedAt || 0)).slice(0, 60);
    } else if (sel.type === "soltos") result = result.filter((i) => i.boardIds.length === 0);
    else if (sel.type === "board") result = result.filter((i) => i.boardIds.includes(sel.id));
    else if (sel.type === "tag") result = result.filter((i) => i.tags.includes(sel.name));

    if (state.kinds.length) result = result.filter((i) => state.kinds.includes(i.kind));

    if (state.query.trim()) return searchItems(result, state.query);
    if (sel.type === "recentes") return result;

    const sorted = result.slice();
    if (state.sort === "antigos") sorted.sort((a, b) => a.createdAt - b.createdAt);
    else if (state.sort === "titulo") sorted.sort((a, b) => String(a.title || "").localeCompare(String(b.title || ""), "pt-BR"));
    else if (state.sort === "abertos") sorted.sort((a, b) => (b.openedAt || 0) - (a.openedAt || 0));
    else sorted.sort((a, b) => b.createdAt - a.createdAt);
    return sorted;
  }

  function relatedTo(item) {
    const tags = new Set(item.tags), boards = new Set(item.boardIds);
    const host = hostOf(item.url);
    return state.items
      .filter((c) => c.id !== item.id)
      .map((candidate) => {
        let score = 0;
        candidate.tags.forEach((t) => { if (tags.has(t)) score += 3; });
        candidate.boardIds.forEach((b) => { if (boards.has(b)) score += 2; });
        if (host && hostOf(candidate.url) === host) score += 2;
        return { candidate, score };
      })
      .filter((entry) => entry.score > 0)
      .sort((a, b) => b.score - a.score || b.candidate.createdAt - a.candidate.createdAt)
      .slice(0, 6)
      .map((entry) => entry.candidate);
  }

  function headerFor(sel) {
    if (sel.type === "favoritos") return ["Favoritos", "O que você marcou como essencial"];

    if (sel.type === "soltos") return ["Sem board", "Referências que ainda não foram organizadas"];

      const board = state.boards.find((b) => b.id === sel.id);
      return board ? [board.emoji + " " + board.name, board.description || ""] : ["Board", ""];
    }
    if (sel.type === "tag") return ["#" + sel.name, "Filtrando por tag"];
    return ["Tudo", "Todo o seu acervo, do mais novo ao mais antigo"];
  }

  const toastTimers = new Map();

  function toast(message, options = {}) {
    const id = uid();
    const node = el("div", { class: "toast", dataset: { tone: options.tone || "info" }, role: "status" }, [
      options.tone === "success" ? svg(ICON.check, 15) : null,
      el("span", { class: "t-text", text: message }),
      options.action
        ? el("button", { class: "t-action", text: options.action.label,
            onclick: () => { options.action.run(); dismissToast(id); } })
        : null,
      el("button", { class: "icon-btn", "aria-label": "Fechar aviso", onclick: () => dismissToast(id),
        html: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">${ICON.close}</svg>` }),
    ]);
    node.dataset.toastId = id;
    $("toasts").append(node);
    while ($("toasts").children.length > 3) $("toasts").firstElementChild.remove();
    toastTimers.set(id, setTimeout(() => dismissToast(id), options.duration || (options.action ? 7000 : 3600)));
    return id;
  }

  function dismissToast(id) {
    clearTimeout(toastTimers.get(id));
    toastTimers.delete(id);
    const node = $("toasts").querySelector(`[data-toast-id="${id}"]`);
    if (node) node.remove();
  }

  /* ═══════════════════════════ capas ══════════════════════════════ */

  function cover(item, { aspect = "auto", compact = false } = {}) {
    const url = coverUrl(item);
    const box = el("div", { class: "cover" });

    if (aspect === "square") box.style.aspectRatio = "1";
    else if (aspect === "video") box.style.aspectRatio = "16 / 9";
    else if (url && item.imageRatio) box.style.aspectRatio = String(item.imageRatio);

    if (url) {
      // draggable=false: arrastar a capa dentro da página criava uma cópia da imagem.
      box.append(el("img", { src: url, alt: "", loading: "lazy", decoding: "async", draggable: "false" }));
      return box;
    }

    const base = colorFromString(hostOf(item.url) || item.title || item.id);

    // As cores da paleta são a própria capa, em qualquer tamanho.
    if (item.kind === "palette" && (item.colors || []).length) {
      box.classList.add("cover-palette");
      if (compact) box.classList.add("compact");
      else if (aspect === "auto") box.style.aspectRatio = "5 / 2";
      item.colors.forEach((color) =>
        box.append(el("span", { style: "background:" + color, title: color.toUpperCase() })));
      return box;
    }

    box.classList.add("cover-fallback");

    if (compact) {
      box.style.background = base + "22";
      if (item.kind === "note") {
        const icon = svg(ICON.note, 14);
        icon.style.color = base;
        box.append(icon);
      } else {
        box.append(el("span", {
          class: "cover-label", style: `color:${base};letter-spacing:0`,
          text: (hostOf(item.url) || item.title || "?").charAt(0).toUpperCase(),
        }));
      }
      return box;
    }

    // Imagem cuja foto não veio junto (um import de JSON sem a pasta): em vez
    // do título em letras grandes, um aviso de que falta o arquivo.
    if (item.kind === "image") {
      if (aspect === "auto") box.style.aspectRatio = "4 / 3";
      box.classList.add("cover-missing");
      const icon = svg(ICON.image, 22);
      icon.style.color = "var(--text-faint)";
      box.append(icon, el("span", { class: "cover-missing-label", text: "imagem não encontrada" }));
      return box;
    }

    if (item.kind === "note") {
      if (aspect === "auto") box.style.aspectRatio = "5 / 2";
      box.style.background = `linear-gradient(150deg, ${base}22, ${base}0d 60%, transparent)`;
      const icon = svg(ICON.note, 24);
      icon.style.color = "var(--text-faint)";
      box.append(icon);
      return box;
    }

    const host = hostOf(item.url);
    if (host) {
      box.classList.remove("cover-fallback");
      box.classList.add("preview");
      if (aspect === "auto") box.style.aspectRatio = "16 / 10";

      // O site dá a família de cor; a ordem de chegada entre as páginas do
      // mesmo site gira o tom (+40°, −40°, +80°…) e troca o rascunho. Irmãs
      // ficam parentes, nunca iguais — e um link novo não muda os antigos.
      const page = pagePath(item.url);
      const rank = siteRank(item, host);
      const step = Math.ceil(rank / 2) * 40 * (rank % 2 ? 1 : -1);
      const tone = rank ? colorFromString(host, step) : base;
      box.style.background =
        `linear-gradient(160deg, ${tone}38, ${tone}14 45%, var(--bg-sunken) 100%)`;

      // A capa diz qual página é: o título que você deu (ou o fim do
      // endereço), com o site pequeno em cima. Só a raiz do site leva o
      // nome do site em destaque.
      const { headline, eyebrow } = coverHeadline(item, host);
      const size = headline.length > 28 ? 15 : headline.length > 15 ? 17 : headline.length > 11 ? 20 : 24;

      box.append(
        el("div", { class: "preview-bar", style: `color:${tone}` }, [
          el("span", { class: "preview-dots" }, [el("i"), el("i"), el("i")]),
          el("span", {
            class: "preview-url",
            style: `background:${tone}1f;color:${tone}`,
            text: host + (page ? "/" + page : ""),
          }),
        ]),
        el("div", { class: "preview-body" }, [
          eyebrow ? el("span", { class: "preview-eyebrow", style: `color:${tone}`, text: eyebrow }) : null,
          el("span", {
            class: "preview-word",
            style: `color:${tone};font-size:${size}px`,
            text: headline,
          }),
          el("span", { class: "preview-rule", style: `background:${tone};opacity:.55` }),
        ]),
        el("span", { class: "preview-sketch", style: `color:${tone}`,
          html: pageSketch(hashOf(host) + rank) }),
      );
      return box;
    }

    if (aspect === "auto") box.style.aspectRatio = "5 / 2";
    box.style.background =
      `radial-gradient(120% 100% at 20% 0%, ${base}40, ${base}14 45%, var(--bg-sunken) 100%)`;
    box.append(el("span", {
      class: "cover-label", style: `color:${base}`,
      text: (item.title || "referência").slice(0, 28),
    }));
    return box;
  }

  /** A posição do link entre os do mesmo site, por ordem de chegada. */
  function siteRank(item, host) {
    const siblings = state.items
      .filter((other) => other.kind === "link" && hostOf(other.url) === host)
      .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0) || (a.id < b.id ? -1 : 1));
    return Math.max(0, siblings.findIndex((other) => other.id === item.id));
  }

  /** "https://warren.com.br/gestao/fundos/" → "gestao/fundos". */
  function pagePath(url) {
    try {
      const parsed = new URL(url);
      const path = decodeURIComponent(parsed.pathname).split("/").filter(Boolean).join("/");
      return path + (parsed.search && !path ? parsed.search : "");
    } catch { return ""; }
  }

  /**
   * O que a capa de um link escreve em destaque. Título que você deu ganha a
   * capa; título que é só o domínio cede lugar ao fim do endereço; a raiz do
   * site fica com o nome do site.
   */
  function coverHeadline(item, host) {
    const word = siteWord(host);
    const title = String(item.title || "").trim();
    const plain = title.toLowerCase().replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/\/$/, "");
    const onlyHost = !title || plain === host || plain === word.toLowerCase();
    if (!onlyHost) return { headline: title, eyebrow: word };
    const last = pagePath(item.url).split("/").filter(Boolean).pop();
    if (last) {
      const cleaned = last.replace(/\.\w{2,5}$/, "").replace(/[-_]+/g, " ").trim();
      if (cleaned) return { headline: cleaned.charAt(0).toUpperCase() + cleaned.slice(1), eyebrow: word };
    }
    return { headline: word, eyebrow: "" };
  }

  /** Quatro rascunhos de página; o endereço sorteia qual. */
  function pageSketch(seed) {
    const s = 'fill="currentColor"';
    const variants = [
      // destaque grande + linhas de texto
      `<rect x="0" y="0" width="120" height="44" rx="5" ${s} opacity=".55"/><rect x="0" y="54" width="86" height="7" rx="3.5" ${s}/><rect x="0" y="67" width="120" height="5" rx="2.5" ${s} opacity=".6"/><rect x="0" y="78" width="104" height="5" rx="2.5" ${s} opacity=".6"/>`,
      // grade de cards
      `<rect x="0" y="0" width="56" height="40" rx="5" ${s} opacity=".55"/><rect x="64" y="0" width="56" height="40" rx="5" ${s} opacity=".35"/><rect x="0" y="48" width="56" height="40" rx="5" ${s} opacity=".35"/><rect x="64" y="48" width="56" height="40" rx="5" ${s} opacity=".55"/>`,
      // círculo + texto ao lado
      `<circle cx="26" cy="30" r="26" ${s} opacity=".5"/><rect x="62" y="12" width="58" height="8" rx="4" ${s}/><rect x="62" y="28" width="46" height="5" rx="2.5" ${s} opacity=".6"/><rect x="62" y="39" width="52" height="5" rx="2.5" ${s} opacity=".6"/><rect x="0" y="68" width="120" height="20" rx="5" ${s} opacity=".35"/>`,
      // colunas
      `<rect x="0" y="0" width="120" height="10" rx="3" ${s} opacity=".55"/><rect x="0" y="18" width="36" height="70" rx="4" ${s} opacity=".35"/><rect x="42" y="18" width="36" height="70" rx="4" ${s} opacity=".55"/><rect x="84" y="18" width="36" height="70" rx="4" ${s} opacity=".35"/>`,
    ];
    return `<svg viewBox="0 0 120 88" aria-hidden="true">${variants[seed % variants.length]}</svg>`;
  }

  /** "www.refactoringui.com" → "refactoringui" — o nome que identifica o site. */
  function siteWord(host) {
    const parts = host.split(".").filter(Boolean);
    if (parts.length < 2) return parts[0] || host;
    // A última parte é sempre o domínio de topo (.br, .ar, .design…), e as
    // genéricas logo antes dela também: "site.com.br" e "site.com.ar" dão "site".
    const generic = new Set(["com", "co", "net", "org", "gov", "edu", "ac"]);
    for (let i = parts.length - 2; i >= 0; i--) {
      if (!generic.has(parts[i])) return parts[i];
    }
    return parts[0];
  }

  /* ═════════════════════════ render: rail ═════════════════════════ */

  function renderRail() {
    const nav = $("rail-nav");
    nav.replaceChildren();

    $("rail-count").textContent =
      state.items.length + (state.items.length === 1 ? " item salvo" : " itens salvos");

    const boardCounts = new Map(), tagCounts = new Map();
    for (const item of state.items) {
      item.boardIds.forEach((id) => boardCounts.set(id, (boardCounts.get(id) || 0) + 1));
      item.tags.forEach((tag) => tagCounts.set(tag, (tagCounts.get(tag) || 0) + 1));
    }

    const current = selectionKey(state.selection);
    const group = () => el("div", { style: "display:flex;flex-direction:column;gap:2px" });

    const navRow = ({ icon, label, count, key, onclick, accent, board }) => {
      const row = el("div", { class: "nav-row" });
      const button = el("button", {
        class: "nav", "aria-current": current === key ? "true" : "false", onclick,
      }, [
        el("span", { class: "nav-icon", style: current === key && accent ? `color:${accent}` : "" },
          [typeof icon === "string" ? document.createTextNode(icon) : icon]),
        el("span", { class: "nav-label", text: label }),
        count ? el("span", { class: "nav-count", text: String(count) }) : null,
      ]);
      row.append(button);
      if (board) {
        row.append(el("button", {
          class: "nav-edit", "aria-label": "Editar " + board.name,
          onclick: (event) => { event.stopPropagation(); openBoardDialog(board); },
          html: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON.edit}</svg>`,
        }));
      }
      return row;
    };

    const quick = group();
    quick.append(
      navRow({ icon: svg(ICON.board, 15), label: "Tudo", count: state.items.length, key: "todos",
        onclick: () => select({ type: "todos" }) }),
      navRow({ icon: svg(ICON.star, 15), label: "Favoritos", key: "favoritos",
        count: state.items.filter((i) => i.favorite).length,
        onclick: () => select({ type: "favoritos" }) }),
      navRow({ icon: svg(ICON.clock, 15), label: "Vistos recentemente", key: "recentes",
        onclick: () => select({ type: "recentes" }) }),
    );
    const loose = state.items.filter((i) => i.boardIds.length === 0).length;
    if (loose) {
      quick.append(navRow({ icon: svg(ICON.tag, 15), label: "Sem board", count: loose, key: "soltos",
        onclick: () => select({ type: "soltos" }) }));
    }
    nav.append(quick);

    nav.append(el("div", { class: "group-title" }, [
      el("span", { text: "Boards" }),
      el("button", { class: "icon-btn", style: "padding:4px", "aria-label": "Criar board",
        onclick: () => openBoardDialog(null),
        html: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">${ICON.plus}</svg>` }),
    ]));

    const boards = group();
    if (!state.boards.length) {
      boards.append(el("p", {
        style: "margin:0;padding:8px 10px;font-size:12px;line-height:1.55;color:var(--text-faint)",
        text: "Boards agrupam referências por assunto. Crie o primeiro no + acima.",
      }));
    }
    state.boards.forEach((board) => {
      boards.append(navRow({
        icon: board.emoji, label: board.name, count: boardCounts.get(board.id) || 0,
        key: "board:" + board.id, accent: board.color, board,
        onclick: () => select({ type: "board", id: board.id }),
      }));
    });
    nav.append(boards);

    const tags = [...tagCounts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    if (tags.length) {
      nav.append(el("div", { class: "group-title" }, [el("span", { text: "Tags" })]));
      const list = group();
      const limit = state.showAllTags ? tags.length : 8;
      tags.slice(0, limit).forEach(([tag, count]) => {
        list.append(navRow({ icon: svg(ICON.tag, 14), label: tag, count, key: "tag:" + tag,
          onclick: () => select({ type: "tag", name: tag }) }));
      });
      if (tags.length > 8) {
        list.append(el("button", {
          class: "nav", style: "font-size:11.5px;color:var(--text-faint)",
          text: state.showAllTags ? "Mostrar menos" : `Ver todas as ${tags.length} tags`,
          onclick: () => { state.showAllTags = !state.showAllTags; renderRail(); },
        }));
      }
      nav.append(list);
    }
  }

  /* ════════════════════════ render: cabeçalho ═════════════════════ */

  function renderHead() {
    const [title, description] = headerFor(state.selection);
    $("head-title").textContent = title;
    $("head-desc").textContent = description;

    const select_ = $("board-select");
    const chosen = select_.value;
    select_.replaceChildren(el("option", { value: "", text: "Sem board" }));
    state.boards.forEach((board) =>
      select_.append(el("option", { value: board.id, text: board.emoji + " " + board.name })));
    select_.value = state.selection.type === "board" ? state.selection.id
      : state.boards.some((b) => b.id === chosen) ? chosen : "";

    const chips = $("kind-chips");
    chips.replaceChildren();
    // Notas não têm filtro próprio: a barra fica com links, imagens e paletas.
    Object.entries(KIND_LABEL).filter(([kind]) => kind !== "note").forEach(([kind, label]) => {
      chips.append(el("button", {
        class: "chip", "aria-pressed": state.kinds.includes(kind) ? "true" : "false", text: label,
        onclick: () => {
          state.kinds = state.kinds.includes(kind)
            ? state.kinds.filter((k) => k !== kind) : state.kinds.concat(kind);
          state.focusedId = null;
          renderHead(); renderGrid();
        },
      }));
    });

    const views = $("view-switch");
    views.replaceChildren();
    [["mural", "Mural"], ["grade", "Grade"], ["lista", "Lista"]].forEach(([key, label]) => {
      views.append(el("button", {
        class: "seg", "aria-pressed": state.view === key ? "true" : "false",
        "aria-label": label, title: "Visualização em " + label.toLowerCase(),
        onclick: () => { state.view = key; persistPrefs(); renderHead(); renderGrid(); },
        html: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON[key]}</svg>`,
      }));
    });

    $("sort-select").value = state.sort;
    $("filter-clear").classList.toggle("hidden", !state.query);
    $("theme-btn").innerHTML =
      `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${resolvedTheme() === "dark" ? ICON.sun : ICON.moon}</svg>`;
  }

  /* ═══════════════════════ render: mural ══════════════════════════ */

  function tagChip(tag) {
    return el("button", { class: "tag", text: tag, tabindex: "-1",
      onclick: (event) => { event.stopPropagation(); select({ type: "tag", name: tag }); } });
  }

  function itemActions(item) {
    const box = el("div", { class: "card-actions" });
    box.append(el("button", {
      class: "act", dataset: { on: item.favorite ? "true" : "false" },
      "aria-label": (item.favorite ? "Remover dos favoritos: " : "Favoritar: ") + item.title,
      onclick: (event) => { event.stopPropagation(); toggleFavorite(item.id); },
      html: `<svg width="14" height="14" viewBox="0 0 24 24" fill="${item.favorite ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">${ICON.star}</svg>`,
    }));
    if (item.url) {
      box.append(el("button", {
        class: "act", "aria-label": "Abrir o link original: " + item.title,
        onclick: (event) => { event.stopPropagation(); openSource(item); },
        html: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON.external}</svg>`,
      }));
    }
    return box;
  }

  function cardFor(item) {
    const focused = state.focusedId === item.id;

    if (state.view === "lista") {
      const row = el("div", { class: "row", dataset: { itemId: item.id, focused: String(focused) },
        ondblclick: () => openSource(item) }, [
        (() => { const t = el("div", { class: "thumb" }); t.append(cover(item, { aspect: "square", compact: true })); return t; })(),
        el("div", { class: "row-main" }, [
          el("h3", { class: "row-title" }, [
            el("button", { class: "title-btn", text: item.title, onclick: () => openDetail(item.id) }),
            item.favorite
              ? el("span", { style: "color:var(--accent);display:grid;flex:none",
                  html: `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">${ICON.star}</svg>` })
              : null,
          ]),
          el("p", { class: "row-sub", style: "margin:2px 0 0",
            text: item.description || hostOf(item.url) ||
              (item.kind === "note" ? "Nota"
                : item.kind === "palette" ? (item.colors || []).join("  ").toUpperCase()
                : "Imagem") }),
        ]),
        el("div", { class: "tags" }, item.tags.slice(0, 3).map(tagChip)),
        el("time", { text: timeAgo(item.createdAt) }),
        itemActions(item),
      ]);
      return row;
    }

    const isGrid = state.view === "grade";
    const showCover = item.kind !== "note";
    const card = el("article", {
      class: "card" + (item.kind === "note" ? " card-note" : ""),
      dataset: { itemId: item.id, focused: String(focused) },
      ondblclick: () => openSource(item),
    });

    if (showCover) {
      const wrap_ = el("div", { style: "position:relative" });
      wrap_.append(cover(item, { aspect: isGrid ? "video" : "auto" }));

      const boards = state.boards.filter((b) => item.boardIds.includes(b.id)).slice(0, 2);
      if (boards.length) {
        wrap_.append(el("div", { class: "card-boards" },
          boards.map((board) => el("span", { class: "board-chip", text: board.emoji + " " + board.name }))));
      }
      wrap_.append(itemActions(item));
      if (item.favorite) {
        wrap_.append(el("span", { class: "fav-mark",
          html: `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">${ICON.star}</svg>` }));
      }
      card.append(wrap_);
    } else {
      card.append(itemActions(item));
    }

    const body = el("div", { class: "card-body" });
    if (!showCover && item.favorite) {
      body.append(el("span", { class: "fav-mark", style: "color:var(--accent)",
        html: `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">${ICON.star}</svg>` }));
    }

    body.append(el("h3", { class: "card-title" }, [
      el("button", { class: "title-btn", text: item.title, onclick: () => openDetail(item.id) }),
    ]));

    if (item.kind === "note" && item.description) {
      body.append(el("p", { class: "card-excerpt", style: "margin:0", text: item.description }));
    }

    const meta = el("div", { class: "card-meta" });
    if (item.kind === "note") { meta.append(svg(ICON.note, 12), el("span", { text: "Nota" })); }
    else if (item.kind === "image") { meta.append(svg(ICON.image, 12), el("span", { text: "Imagem" })); }
    else if (item.kind === "palette") {
      const count = (item.colors || []).length;
      meta.append(svg(ICON.palette, 12),
        el("span", { text: count === 1 ? "1 cor" : count + " cores" }));
    }
    else { meta.append(el("span", { class: "host", text: hostOf(item.url) || "referência" })); }
    meta.append(el("span", { "aria-hidden": "true", text: "·" }),
      el("time", { text: timeAgo(item.createdAt) }));
    body.append(meta);

    if (item.tags.length) {
      const max = isGrid ? 2 : 4;
      const tags = el("div", { class: "tags" }, item.tags.slice(0, max).map(tagChip));
      if (item.tags.length > max) {
        tags.append(el("span", { class: "tag-more", text: "+" + (item.tags.length - max) }));
      }
      body.append(tags);
    }

    card.append(body);
    return card;
  }

  function renderGrid() {
    const items = visibleItems();
    const grid = $("grid");
    grid.className = state.view;
    grid.replaceChildren();

    $("result-count").textContent =
      items.length + (items.length === 1 ? " referência" : " referências");

    if (!state.ready) {
      grid.className = "mural";
      [220, 300, 180, 260, 200, 320, 240, 190].forEach((height) => {
        grid.append(el("div", {
          class: "card",
          style: `height:${height}px;opacity:.5;animation:fade .4s ease-out alternate infinite`,
        }));
      });
      return;
    }

    if (!items.length) { grid.className = ""; grid.append(emptyState()); return; }
    items.forEach((item) => grid.append(cardFor(item)));
  }

  function emptyState() {
    const query = state.query.trim();
    // Filtro de tipo também esvazia a lista: aí a mensagem é sobre o filtro,
    // não "board vazio" nem "nenhum favorito".
    const filtering = query.length > 0 || state.kinds.length > 0;
    const sel = state.selection.type;
    let title, body, action = null, aside = null;

    if (filtering) {
      title = query ? `Nada encontrado para “${query}”` : "Nenhuma referência deste tipo aqui";
      body = "Tente outra palavra, ou limpe os filtros pra ver tudo de novo.";
      action = { label: "Limpar filtros", run: clearFilters };
    } else if (!state.items.length) {
      title = "Seu acervo começa aqui";
      body = "Cole um link ou um punhado de hexadecimais na barra de cima, escreva uma ideia ou arraste uma imagem pra dentro da janela.";
      action = { label: "Adicionar a primeira referência", run: focusCapture };
      // Acervo vazio é também a cara de um navegador limpo. Quem já salvava
      // numa pasta volta ao que era em um clique, daqui mesmo.
      if (vaultSupported() && !vaultOn()) {
        aside = { label: "Já tenho uma pasta de acervo", run: () => { void pickVault(); } };
      }
    } else if (sel === "board") {
      title = "Board vazio por enquanto";
      body = "Salve algo com este board selecionado na barra de captura, ou abra uma referência e marque este board no painel de detalhe.";
      action = { label: "Adicionar referência", run: focusCapture };
    } else if (sel === "favoritos") {
      title = "Nenhum favorito ainda";
      body = "Aperte F sobre um card (ou clique na estrela) pra deixar as referências mais importantes sempre à mão.";
    } else if (sel === "recentes") {
      title = "Nada aberto ainda";
      body = "As referências que você abrir aparecem aqui, na ordem em que foram consultadas.";
    } else {
      title = "Nada por aqui";
      body = "Nenhuma referência corresponde a este recorte.";
      action = { label: "Ver tudo", run: clearFilters };
    }

    return el("div", { class: "empty" }, [
      el("span", { class: "empty-badge",
        html: `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${filtering ? ICON.search : ICON.spark}</svg>` }),
      el("h2", { text: title }),
      el("p", { text: body }),
      el("div", { class: "row-actions", style: "justify-content:center" }, [
        action ? el("button", { class: "btn btn-primary", text: action.label, onclick: action.run }) : null,
        aside ? el("button", { class: "btn btn-ghost", text: aside.label, onclick: aside.run }) : null,
      ]),
    ]);
  }

  /* ═══════════════════════ gaveta de detalhe ══════════════════════ */

  let overlayStack = [];

  /**
   * Registra uma sobreposição e devolve a função que a fecha. `onDismiss`
   * existe para que Esc feche pelo mesmo caminho de quem clicou fora — a
   * gaveta, por exemplo, precisa limpar o `detailId` junto.
   */
  function mountOverlay(nodes, onDismiss) {
    const list = [].concat(nodes);
    const entry = { nodes: list, onDismiss: null };
    const dismiss = () => {
      overlayStack = overlayStack.filter((e) => e !== entry);
      list.forEach((node) => node.remove());
    };
    entry.onDismiss = onDismiss ? () => onDismiss(dismiss) : dismiss;
    overlayStack.push(entry);
    list.forEach((node) => $("overlays").append(node));
    return dismiss;
  }

  function closeTopOverlay() {
    const top = overlayStack[overlayStack.length - 1];
    if (top) { top.onDismiss(); return true; }
    return false;
  }

  /**
   * `navigating`: veio das setas/J/K do próprio painel. A ordem da navegação é
   * a da lista no momento em que o painel abriu — senão, em "Vistos
   * recentemente", abrir uma referência a jogava pro topo e J/K ficavam
   * pulando entre as duas primeiras.
   */
  function openDetail(id, { navigating = false } = {}) {
    if (!navigating || !detailOrder) detailOrder = visibleItems().map((item) => item.id);
    state.detailId = id;
    state.focusedId = id;
    touchOpened(id);
    renderGrid();
    renderDetail();
  }

  /** A ordem de navegação do painel aberto, sem o que foi apagado no meio. */
  let detailOrder = null;
  function detailList() {
    const alive = new Set(state.items.map((item) => item.id));
    return (detailOrder || visibleItems().map((item) => item.id)).filter((id) => alive.has(id));
  }

  /** No painel de uma imagem que não veio junto: como trazê-la de volta. */
  function missingImageBox(item) {
    const picker = el("input", { type: "file", accept: "image/*", hidden: true });
    picker.addEventListener("change", async () => {
      const file = picker.files && picker.files[0];
      if (!file) return;
      // SVG e GIF entram como estão: redesenhar no canvas perderia o vetor e a animação.
      const isVector = file.type === "image/svg+xml" || file.type === "image/gif";
      const { blob, ratio } = isVector ? { blob: file, ratio: 1 } : await compressImage(file);
      await attachImage(item.id, blob, { ratio });
      scheduleVaultSave();
      renderGrid(); renderDetail();
      toast("Imagem de volta na referência", { tone: "success" });
    });
    return el("div", { class: "missing-image", style: "margin:16px 20px 0" }, [
      el("p", { text: "A imagem desta referência não veio junto"
        + (item.image ? ` — na pasta ela se chamava ${baseName(item.image)}` : "")
        + ". Escolha o arquivo, ou a pasta do acervo inteira, e ela volta pra cá." }),
      el("div", { class: "row-actions", style: "margin-top:0" }, [
        el("button", { class: "btn btn-primary", onclick: () => picker.click() }, [svg(ICON.upload, 14), "Escolher o arquivo"]),
        el("button", { class: "btn btn-ghost", onclick: () => pickFolder() }, [svg(ICON.folder, 14), "Escolher a pasta"]),
        picker,
      ]),
    ]);
  }

  function closeDetail() {
    state.detailId = null;
    if (detailClose) { detailClose(); detailClose = null; }
    detailDom = null;
    detailOrder = null;
    pendingDetail = false;
    renderGrid();
  }

  /**
   * Com o botão do mouse apertado, o painel não é redesenhado: apertar um
   * botão tira o foco do campo que você editava, o campo salva, e redesenhar
   * naquele instante trocava o botão por outro antes de o clique terminar —
   * o clique se perdia. O redesenho espera o clique acabar.
   */
  let pointerHeld = false;
  let pendingDetail = false;
  document.addEventListener("pointerdown", () => { pointerHeld = true; }, true);
  const releasePointer = () => setTimeout(() => {
    pointerHeld = false;
    if (pendingDetail) { pendingDetail = false; if (state.detailId) renderDetail(); }
  }, 0);
  document.addEventListener("pointerup", releasePointer, true);
  document.addEventListener("pointercancel", releasePointer, true);

  let detailClose = null;
  /** O painel aberto: { id, panel }. Editar redesenha dentro dele, sem reabrir. */
  let detailDom = null;

  function renderDetail() {
    const item = state.items.find((i) => i.id === state.detailId);
    if (!item) return;

    // Com o painel já aberto, ele é redesenhado no lugar: sem a animação de
    // entrada, sem perder a rolagem e sem tirar o cursor do campo em que você
    // estava. Antes cada edição fechava e reabria o painel inteiro.
    const reuse = Boolean(detailDom && detailDom.panel.isConnected);
    if (reuse && pointerHeld) { pendingDetail = true; return; }
    let keep = null;
    if (reuse) {
      const active = document.activeElement;
      const oldBody = detailDom.panel.querySelector(".drawer-body");
      keep = {
        same: detailDom.id === item.id,
        scroll: oldBody ? oldBody.scrollTop : 0,
        field: active && detailDom.panel.contains(active) && active.dataset ? active.dataset.field : null,
        value: active && "value" in active ? active.value : null,
        start: active && "selectionStart" in active ? active.selectionStart : null,
        end: active && "selectionEnd" in active ? active.selectionEnd : null,
      };
    } else if (detailClose) {
      detailClose(); detailClose = null;
    }

    const list = detailList();
    const index = list.indexOf(item.id);

    const scrim = el("div", { class: "scrim", onclick: closeDetail });
    const panel = el("aside", { class: "drawer", role: "dialog", "aria-modal": "true", "aria-label": item.title });

    // Cada botão tem uma chave (data-field) pra o foco do teclado voltar a ele
    // depois de um redesenho.
    const navButton = (direction, label, enabled) => el("button", {
      class: "icon-btn", "aria-label": label, disabled: !enabled,
      dataset: { field: direction === -1 ? "nav-prev" : "nav-next" },
      style: enabled ? "" : "opacity:.3;cursor:default",
      onclick: () => { if (enabled) openDetail(list[index + direction], { navigating: true }); },
      html: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${direction === -1 ? 180 : 0}deg)">${ICON.chevron}</svg>`,
    });

    panel.append(el("header", { class: "drawer-head" }, [
      el("button", { class: "icon-btn", "aria-label": "Fechar (Esc)", onclick: closeDetail, dataset: { field: "close" },
        html: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">${ICON.close}</svg>` }),
      el("span", { class: "spacer" }),
      navButton(-1, "Referência anterior (K)", index > 0),
      navButton(1, "Próxima referência (J)", index >= 0 && index < list.length - 1),
      el("span", { style: "width:1px;height:16px;background:var(--border);margin:0 4px" }),
      el("button", {
        class: "icon-btn", "aria-label": item.favorite ? "Remover dos favoritos (F)" : "Favoritar (F)",
        dataset: { field: "fav" },
        style: item.favorite ? "color:var(--accent)" : "",
        onclick: () => toggleFavorite(item.id),
        html: `<svg width="16" height="16" viewBox="0 0 24 24" fill="${item.favorite ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">${ICON.star}</svg>` }),
      el("button", {
        class: "icon-btn", "aria-label": "Excluir referência", style: "color:var(--text-faint)",
        onclick: () => removeItem(item),
        html: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON.trash}</svg>` }),
    ]));

    const body = el("div", { class: "drawer-body" });
    if (item.imageBlob || item.kind === "palette" || hostOf(item.url)) {
      const box = cover(item, { aspect: "auto" });
      box.classList.add("drawer-cover");
      body.append(box);
    } else if (item.kind === "image") {
      body.append(missingImageBox(item));
    }

    const content = el("div", { class: "drawer-content" });

    const titleField = el("textarea", { class: "drawer-title", rows: "1", dataset: { field: "title" } });
    titleField.value = item.title;
    const growTitle = () => {
      titleField.style.height = "auto";
      titleField.style.height = titleField.scrollHeight + "px";
    };
    titleField.addEventListener("input", growTitle);
    titleField.addEventListener("blur", () => {
      const next = titleField.value.trim();
      if (next && next !== item.title) { updateItem(item.id, { title: next }).then(afterEdit); }
      else if (!next) titleField.value = item.title;
    });
    titleField.addEventListener("keydown", (event) => {
      if (event.key === "Enter") { event.preventDefault(); titleField.blur(); }
    });

    const meta = el("div", { class: "drawer-meta" });
    const host = hostOf(item.url);
    if (host) meta.append(el("span", { class: "host", text: host }), el("span", { text: "·" }));
    meta.append(el("span", { text: "Salvo em " + formatDate(item.createdAt) }));
    if (item.imageBlob && vaultOn() && vault.index.has(item.id)) {
      // O arquivo segue o título: renomeou aqui, renomeia na pasta.
      meta.append(el("span", { text: "·" }),
        el("span", { class: "host", title: "O arquivo na pasta do acervo — muda junto com o título",
          dataset: { imageFile: item.id }, text: VAULT_IMAGES + "/" + vault.index.get(item.id) }));
    }

    content.append(el("div", {}, [titleField, meta]));

    if (item.url) {
      content.append(el("div", { style: "display:flex;gap:8px;flex-wrap:wrap" }, [
        el("button", { class: "btn btn-primary", style: "flex:1;justify-content:center",
          onclick: () => openSource(item) }, [svg(ICON.external, 15), "Abrir original"]),
        el("button", { class: "btn btn-ghost", onclick: (event) => copyUrl(item, event.currentTarget) },
          [svg(ICON.copy, 15), "Copiar link"]),
      ]));
    }

    if (item.description) {
      content.append(el("section", {}, [
        el("span", { class: "field-label", text: item.kind === "note" ? "Conteúdo" : "Resumo" }),
        el("p", { class: "prose", text: item.description }),
      ]));
    }

    const notes = el("textarea", {
      class: "textarea", rows: "3", dataset: { field: "notes" },
      placeholder: "Por que isso importa? O que você quer reaproveitar daqui?",
    });
    notes.value = item.notes || "";
    notes.addEventListener("blur", () => {
      const next = notes.value.trim();
      if (next !== (item.notes || "")) updateItem(item.id, { notes: next || undefined }).then(afterEdit);
    });
    content.append(el("section", {}, [
      el("span", { class: "field-label", text: "Suas anotações" }), notes,
    ]));

    if (item.kind === "palette") {
      const colors = item.colors || [];
      const list = el("div", { class: "swatch-list" });

      // `resting` é o texto de sempre do botão: lido na hora do clique, um
      // segundo clique rápido guardava "copiado!" como original e ficava preso.
      const copy = async (value, node, done, resting) => {
        try {
          await navigator.clipboard.writeText(value);
          node.textContent = done;
          clearTimeout(node._restore);
          node._restore = setTimeout(() => { node.textContent = resting; }, 1200);
        } catch {
          toast("Não consegui copiar — o navegador bloqueou", { tone: "error" });
        }
      };

      colors.forEach((color, index) => {
        // O input de cor fica por cima do swatch: clicar abre o seletor nativo
        // e trocar o valor edita a cor no lugar.
        const picker = el("input", { type: "color", value: color, "aria-label": "Editar " + color,
          style: "position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0" });
        picker.addEventListener("change", () => {
          const next = colors.slice();
          next[index] = normalizeHex(picker.value) || color;
          updateItem(item.id, { colors: next }).then(afterEdit);
        });

        const chip = el("span", { class: "swatch-chip", style: "background:" + color + ";position:relative" });
        chip.append(picker);

        const hex = el("button", { class: "swatch-hex", text: color });
        hex.addEventListener("click", () => copy(color, hex, "copiado!", color));

        list.append(el("div", { class: "swatch-row" }, [
          chip, hex,
          el("span", { class: "swatch-name", text: colorName(color) }),
          el("button", {
            class: "icon-btn", "aria-label": "Remover " + color,
            onclick: () => updateItem(item.id, { colors: colors.filter((_, i) => i !== index) }).then(afterEdit),
            html: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${ICON.close}</svg>`,
          }),
        ]));
      });

      const newColor = el("input", { type: "color", value: "#d97757", "aria-label": "Escolher cor" });
      const newHex = el("input", { type: "text", placeholder: "#rrggbb ou cole várias de uma vez", dataset: { field: "new-hex" } });
      const pushColors = (toAdd) => {
        const next = colors.slice();
        toAdd.forEach((color) => { if (color && !next.includes(color)) next.push(color); });
        if (next.length !== colors.length) updateItem(item.id, { colors: next }).then(afterEdit);
      };
      // Texto digitado manda; o seletor só entra com o campo vazio. Texto que
      // não é cor fica no campo, com aviso, em vez de virar a cor do seletor.
      const addColors = () => {
        const typed = newHex.value.trim();
        if (!typed) { pushColors([normalizeHex(newColor.value)]); return; }
        const parsed = parsePalette(typed) || (normalizeHex(typed) ? [normalizeHex(typed)] : null);
        if (!parsed) { toast(`“${typed}” não é uma cor — use #rrggbb`, { tone: "error" }); return; }
        newHex.value = "";
        pushColors(parsed);
      };
      newHex.addEventListener("keydown", (event) => {
        if (event.key === "Enter") { event.preventDefault(); addColors(); }
      });
      newColor.addEventListener("change", () => pushColors([normalizeHex(newColor.value)]));

      const copyAll = el("button", { class: "btn btn-ghost", text: "Copiar todas" });
      copyAll.addEventListener("click", () => copy(colors.join(" "), copyAll, "Copiado!", "Copiar todas"));

      content.append(el("section", {}, [
        el("span", { class: "field-label", text: "Cores" }),
        list,
        el("div", { class: "swatch-add" }, [
          newColor, newHex,
          el("button", { class: "btn btn-ghost", text: "Adicionar", onclick: addColors }),
        ]),
        el("div", { style: "margin-top:10px" }, [copyAll]),
      ]));
    }

    const tagBox = el("div", { class: "tag-editor" });
    item.tags.forEach((tag) => {
      tagBox.append(el("span", { class: "tag-pill" }, [
        el("button", { text: tag, style: "padding:0;color:inherit",
          onclick: () => { closeDetail(); select({ type: "tag", name: tag }); } }),
        el("button", { "aria-label": "Remover tag " + tag,
          onclick: () => updateItem(item.id, { tags: item.tags.filter((t) => t !== tag) }).then(afterEdit),
          html: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${ICON.close}</svg>` }),
      ]));
    });
    const tagInput = el("input", { id: "tag-input", placeholder: "+ tag", dataset: { field: "tag" } });
    const commitTag = () => {
      const tag = slugifyTag(tagInput.value);
      tagInput.value = "";
      if (!tag || item.tags.includes(tag)) return;
      updateItem(item.id, { tags: item.tags.concat(tag) }).then(afterEdit);
    };
    tagInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === ",") { event.preventDefault(); commitTag(); }
      else if (event.key === "Backspace" && !tagInput.value && item.tags.length) {
        updateItem(item.id, { tags: item.tags.slice(0, -1) }).then(afterEdit);
      } else if (event.key === "Escape" && tagInput.value) {
        event.stopPropagation(); tagInput.value = "";
      }
    });
    tagInput.addEventListener("blur", () => { if (tagInput.value) commitTag(); });
    tagBox.append(tagInput);
    content.append(el("section", {}, [el("span", { class: "field-label", text: "Tags" }), tagBox]));

    const boardBox = el("div", { style: "display:flex;flex-wrap:wrap;gap:6px" });
    if (!state.boards.length) {
      boardBox.append(el("p", { class: "prose", style: "font-size:12px", text: "Nenhum board criado ainda." }));
    }
    state.boards.forEach((board) => {
      const on = item.boardIds.includes(board.id);
      boardBox.append(el("button", {
        class: "board-toggle", "aria-pressed": on ? "true" : "false", dataset: { field: "board:" + board.id },
        onclick: () => updateItem(item.id, {
          boardIds: on ? item.boardIds.filter((b) => b !== board.id) : item.boardIds.concat(board.id),
        }).then(afterEdit),
      }, [
        el("span", { text: board.emoji }), board.name,
        svg(on ? ICON.check : ICON.plus, 11),
      ]));
    });
    content.append(el("section", {}, [el("span", { class: "field-label", text: "Boards" }), boardBox]));

    const related = relatedTo(item);
    if (related.length) {
      const list_ = el("div", { class: "related" });
      related.forEach((candidate) => {
        const thumb = el("div", { class: "thumb" });
        thumb.append(cover(candidate, { aspect: "square", compact: true }));
        list_.append(el("button", { class: "related-row", onclick: () => openDetail(candidate.id) }, [
          thumb,
          el("span", { class: "rel-main" }, [
            el("span", { class: "rel-title", text: candidate.title }),
            el("span", { class: "rel-sub",
              text: candidate.tags.slice(0, 3).join(" · ") || hostOf(candidate.url)
                || ({ image: "Imagem", palette: "Paleta", note: "Nota" })[candidate.kind] || "Link" }),
          ]),
          svg(ICON.chevron, 14),
        ]));
      });
      content.append(el("section", {}, [
        el("span", { class: "field-label", text: "Relacionadas" }), list_,
      ]));
    }

    body.append(content);
    panel.append(body);

    if (reuse) {
      const live = detailDom.panel;
      live.replaceChildren(...panel.childNodes);
      live.setAttribute("aria-label", item.title);
      detailDom.id = item.id;
      if (keep.same) live.querySelector(".drawer-body").scrollTop = keep.scroll;
      // O foco volta pro mesmo controle — na mesma referência, qualquer um;
      // indo pra outra com as setas, as próprias setas.
      const navigatingKey = keep.field && keep.field.startsWith("nav");
      const field = keep.field && (keep.same || navigatingKey)
        && live.querySelector(`[data-field="${CSS.escape(keep.field)}"]`);
      if (field) {
        // O que você já tinha digitado no campo continua lá.
        if (keep.same && keep.value !== null && "value" in field && field.value !== keep.value) field.value = keep.value;
        field.focus({ preventScroll: true });
        if (keep.start !== null && typeof field.setSelectionRange === "function") {
          try { field.setSelectionRange(keep.start, keep.end); } catch { /* campo sem seleção */ }
        }
      }
    } else {
      detailClose = mountOverlay([scrim, panel], () => closeDetail());
      detailDom = { id: item.id, panel };
    }
    requestAnimationFrame(growTitle);
  }

  function afterEdit() {
    renderRail(); renderGrid();
    if (state.detailId) renderDetail();
  }

  async function copyUrl(item, button) {
    try {
      await navigator.clipboard.writeText(item.url);
      button.replaceChildren(svg(ICON.check, 15), document.createTextNode("Copiado"));
      setTimeout(() => button.replaceChildren(svg(ICON.copy, 15), document.createTextNode("Copiar link")), 1600);
    } catch {
      toast("Não consegui copiar — o navegador bloqueou", { tone: "error" });
    }
  }

  /* ══════════════════════════ paleta ⌘K ═══════════════════════════ */

  const hintFor = (item) => hostOf(item.url)
    || ({ note: "nota", image: "imagem", palette: "paleta" })[item.kind] || "link";

  function openPalette() {
    // ⌘K com a busca já aberta só volta o cursor pra ela, sem abrir outra por cima.
    const open = $("palette-input");
    if (open) { open.focus(); open.select(); return; }
    let rows = [], active = 0;

    const input = el("input", { id: "palette-input", placeholder: "Buscar referência, board ou tag…", autocomplete: "off" });
    const list = el("div", { class: "palette-list" });

    const panel = el("div", { class: "palette", role: "dialog", "aria-modal": "true", "aria-label": "Busca rápida" }, [
      el("div", { class: "palette-input-row" }, [
        svg(ICON.search, 17), input,
        el("kbd", { text: "esc" }),
      ]),
      list,
      el("div", { class: "palette-foot" }, [
        el("span", {}, [el("kbd", { text: "↑↓" }), " navegar"]),
        el("span", {}, [el("kbd", { text: "↵" }), " abrir"]),
        el("span", {}, [el("kbd", { text: "esc" }), " fechar"]),
      ]),
    ]);

    const scrim = el("div", { class: "palette-scrim" });
    scrim.append(panel);
    scrim.addEventListener("click", (event) => { if (event.target === scrim) dismiss(); });

    const dismiss = mountOverlay(scrim);

    function build() {
      const query = input.value.trim();
      rows = [];

      if (!query) {
        state.items.slice()
          .sort((a, b) => (b.openedAt || b.createdAt) - (a.openedAt || a.createdAt))
          .slice(0, 6)
          .forEach((item) => rows.push({
            group: "Continuar de onde parou", label: item.title, item,
            hint: hintFor(item),
            run: () => openDetail(item.id),
          }));
      } else {
        searchItems(state.items, query).slice(0, 8).forEach((item) => rows.push({
          group: "Referências", label: item.title, item,
          hint: hintFor(item),
          run: () => openDetail(item.id),
        }));

        state.boards
          .map((board) => ({ board, score: fuzzy(query, board.name) }))
          .filter((entry) => entry.score)
          .sort((a, b) => b.score - a.score).slice(0, 4)
          .forEach(({ board }) => rows.push({
            group: "Boards", label: board.emoji + " " + board.name, hint: "board",
            icon: ICON.board, run: () => select({ type: "board", id: board.id }),
          }));

        const tags = new Set();
        state.items.forEach((item) => item.tags.forEach((t) => tags.add(t)));
        [...tags].map((tag) => ({ tag, score: fuzzy(query, tag) }))
          .filter((entry) => entry.score)
          .sort((a, b) => b.score - a.score).slice(0, 5)
          .forEach(({ tag }) => rows.push({
            group: "Tags", label: tag, hint: "tag", icon: ICON.tag,
            run: () => select({ type: "tag", name: tag }),
          }));
      }

      rows.push(
        { group: "Ações", label: "Adicionar referência", hint: "A", icon: ICON.plus, run: focusCapture },
        { group: "Ações", label: "Criar novo board", hint: "B", icon: ICON.board, run: () => openBoardDialog(null) },
        { group: "Ações", label: "Ver favoritos", icon: ICON.star, run: () => select({ type: "favoritos" }) },
        { group: "Ações", label: "Atalhos do teclado", hint: "?", icon: ICON.spark, run: openShortcuts },
      );

      active = 0;
      paint();
    }

    function paint() {
      list.replaceChildren();
      if (!rows.length) {
        list.append(el("p", { style: "padding:32px 12px;text-align:center;font-size:13px;color:var(--text-faint)",
          text: `Nada encontrado para “${input.value.trim()}”.` }));
        return;
      }
      let lastGroup = "";
      rows.forEach((row, index) => {
        if (row.group !== lastGroup) {
          lastGroup = row.group;
          list.append(el("p", { class: "palette-group", style: "margin:0", text: row.group }));
        }
        const button = el("button", {
          class: "palette-row", dataset: { active: index === active ? "true" : "false", index: String(index) },
          onmousemove: () => { if (active !== index) { active = index; paint(); } },
          onclick: () => { row.run(); dismiss(); },
        });
        if (row.item) {
          const thumb = el("div", { class: "thumb" });
          thumb.append(cover(row.item, { aspect: "square", compact: true }));
          button.append(thumb);
        } else {
          button.append(el("span", { class: "p-icon" }, [svg(row.icon || ICON.spark, 15)]));
        }
        button.append(el("span", { class: "p-label", text: row.label }));
        if (row.hint) button.append(el("span", { class: "p-hint", text: row.hint }));
        list.append(button);
      });
      const activeNode = list.querySelector('[data-active="true"]');
      if (activeNode) activeNode.scrollIntoView({ block: "nearest" });
    }

    input.addEventListener("input", build);
    panel.addEventListener("keydown", (event) => {
      if (event.key === "ArrowDown") { event.preventDefault(); active = (active + 1) % rows.length; paint(); }
      else if (event.key === "ArrowUp") { event.preventDefault(); active = (active - 1 + rows.length) % rows.length; paint(); }
      else if (event.key === "Enter") { event.preventDefault(); const row = rows[active]; if (row) { row.run(); dismiss(); } }
      else if (event.key === "Escape") { event.preventDefault(); event.stopPropagation(); dismiss(); }
    });

    build();
    input.focus();
  }
